# The `data-agent` agent preset: the four-phase NL→SQL data agent.
#
# This file is an AGENT-PLANE composition (mirror `standard/agent.cordis.yml`).
# The roster mounts it ONCE under a standing scope; every session naming it
# joins by scope parentage, so the tools and prompt sections registered here
# cover each joined agent while per-session state stays keyed inside the
# plugins. The host composition (`base.cordis.yml` + the `data-agent` bundle
# patch) keeps everything a preset must not own: the registries themselves,
# the sandbox/approval stack, persistence, and the model route.
#
# A service row here MUST sit inside a group carrying an `isolate` realm
# (without one it publishes into the root realm, process-global — a second
# preset publishing the same name collides, and `dsh-agent-presets` rejects
# that at mount). `phase-gate` owns per-agent phase state keyed inside the
# plugin, so an entry-local realm is the correct lifetime.
#
# P7b ships the phase-gate plugin (`@deepseek-ai/dsh-phase-gate`): the
# four-phase pipeline re-expressed on harness event seams (7 hooks: guard +
# turn-stopping + post-execute + request + assemble + llm/stream + pre-step,
# + agent/status for question-start). phase-gate ALSO owns the persona
# (base persona section shadowing the deployment default + dynamic
# per-phase instructions injected at `system-prompt/assemble` — option C),
# so this preset mounts NO separate `persona` row. Model routing stays out
# of the preset (`installAgentLlmTarget` seam); phase-gate layers per-phase
# `reasoningEffort` via the `agent/request` waterfall.
#
# The data-agent's model-facing tools are rows BELOW. Four are shipped +
# uncommented (search_data_sources / query_data / load_table_definition /
# load_event_definition); the rest (critique_sql_tool / evaluate_sql_quality
# / present_*) stay commented placeholders — uncomment each only after its
# package ships, since a bare specifier to a not-yet-shipped package breaks
# `pnpm install` and `verify-cordis-config` (P13b → critique_sql_tool /
# evaluate_sql_quality; INTERPRETATION delivery tools → a later ticket). ids
# and the phase-gate tool whitelists follow the map Decisions so far.
# phase-gate's guard is forward-compatible — the whitelists name the stable
# rbi roster, so an unregistered tool is simply uncallable (no model can
# reach it), not a broken mount.

# ── phase-gate orchestration (P7b) ───────────────────────────────────────────
# Per-agent phase state + the 7 event hooks. Entry-local realm: this standing
# mount's own private instance, apart from every other preset's.
- id: phase-gating
  name: cordis:group
  group: true
  isolate:
    phaseGate: true
  config:
    - id: phase-gate
      name: '@deepseek-ai/dsh-phase-gate'
      config:
        scopeId: game-1
        max_fallbacks: 2
        max_subquestions: 4
        max_executions_per_turn: 8
        max_llm_calls_per_turn: 60
        max_state_turns: 20
        stall_watchdog_seconds: 300
        critic_tools_registered: true   # (b) critic tools shipped -> re-tighten the GENERATION gate (requires last_critique/last_quality) + F2 active

# ── data-agent model-facing tools (4 shipped + uncommented; placeholders commented) ───────
# Four tools below are shipped + uncommented (search_data_sources /
# query_data / load_table_definition / load_event_definition). The remaining
# rows (critique_sql_tool / evaluate_sql_quality / present_*) are commented
# placeholders: a bare specifier (name: '@deepseek-ai/dsh-<pkg>') to a
# not-yet-shipped package breaks pnpm install and verify-cordis-config today;
# uncomment and supply each `name:` only after the package ships. The
# phase-gate guard whitelists (UNDERSTANDING/GENERATION/EXECUTION/
# INTERPRETATION_TOOLS) already name these tools, so registering one makes
# it callable in its phase.
#
- id: tool-search-data-sources   # UNDERSTANDING (P13b sub-item; Bm25Linker Q1 thin default, swap -> ctx.retrieval P5b / ctx.schema P6b)
  name: '@deepseek-ai/dsh-tool-search-data-sources'
- id: tool-load-table-definition # UNDERSTANDING/GENERATION (P6 semantic-layer → ctx.schema.loadTableDefinition)
  name: '@deepseek-ai/dsh-tool-load-table-definition'
- id: tool-load-event-definition # UNDERSTANDING/GENERATION (P6 → ctx.schema.loadEventDefinition)
  name: '@deepseek-ai/dsh-tool-load-event-definition'
- id: tool-query-data            # EXECUTION (P4c: ctx.query.execute → MaxCompute via maxc-sidecar; agent runs its own SQL)
  name: '@deepseek-ai/dsh-query-tool'
# - id: tool-retrieve            # ESCAPE-HATCH (D2c-impl): on-demand retrieval over the same BM25 corpus as search_data_sources; additive escape-hatch for when the UNDERSTANDING prefetch missed. SHIPPED but DORMANT (opt-in, mirrors D2e/P5b dormant-until-mount) — default boot does NOT mount it = pipeline-only current state, no regression. Activation = uncomment this row + add `retrieve` to the phase-gate whitelist + land the persona (P7b) teaching "prefer prefetched context; call retrieve only when the gap is obvious" (avoid double-retrieval redundancy). Soft-fallback == search_data_sources (ctx.retrieval -> ctx.schema enriched Bm25Linker -> empty Bm25Linker; NO FakeHash/FakeReranker default per D2d). Additive/reversible — unship if D2c-revisit regresses.
#   name: '@deepseek-ai/dsh-tool-retrieve'
- id: tool-critique-sql          # GENERATION ((b) folded-regex critic via critique_sql_tool; ctx.criticCtx service from phase-gate)
  name: '@deepseek-ai/dsh-tool-critique-sql'
- id: tool-evaluate-sql-quality  # GENERATION ((b) 0-100 quality score; paired with critique_sql_tool)
  name: '@deepseek-ai/dsh-tool-evaluate-sql-quality'
