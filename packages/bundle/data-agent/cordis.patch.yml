# The dsh-data-agent bundle patch: a patch layer over dsh-base for the
# data-agent profile. It is additive-only — it disables the code-agent
# surface (disable, never delete, so an upstream base reorder cannot
# re-mount it) and reserves an insert block of placeholders for the data
# capability plugins this profile will mount once their packages ship
# (P4-P11). It inserts nothing itself yet: a bare specifier to a
# not-yet-shipped package breaks pnpm install and verify-cordis-config,
# so each data-plugin row stays commented until its package exists.
#
# A patch targets a row by id and replaces its whole `config`; `disabled` is
# an entry flag, so `- id: <row> disabled: true` deactivates a base row
# without touching its package, its source, or the base patch. Disabling
# rather than deleting is deliberate (the base is shared): a row absent
# from this overlay would silently reappear if base's row order changed,
# while a `disabled: true` here holds regardless of composition order.
#
# The package has no runtime API; the profile composer resolves this patch
# through the `dsh.bundle.patch` manifest field. Inspect the composed tree:
#   dsh --profile headless --patch ./packages/bundle/data-agent/cordis.patch.yml --dump-config
# A standalone data-agent profile is created out-of-tree through
# `dsh plugin --profile data-agent add @deepseek-ai/dsh-data-agent` once the
# four-phase preset (P7) and its driver land; this bundle touches no shared
# boot glue, preserving the upstream upgrade path.

# ── disable the code-agent surface (map Q2: disable-only, not delete) ────────
# The data agent answers data questions (NL->SQL); it does not edit code or
# iterate build scripts, so the coding-agent tools stay off. `tool-pwsh` is
# already gated off on POSIX by base's own platform guard, so this layer does
# not restate it. `tool-bash` and `code-runtime` are execution backends the
# data agent itself uses (map Q9); they stay enabled here and are gated from
# business users at the P10 intranet tool-gate, not in this bundle.

- id: tool-str-replace-editor
  disabled: true

- id: tool-ralph
  disabled: true

# ── planning-OFF host disable (G1c variant toggle) ─────────────────────────
# goal/todo + plan-mode are host-mounted by base; the data-agent bundle
# host-disables them so A/D are clean planning-OFF controls (A is also
# planning-OFF via the phase-gate guard rejecting non-whitelisted goal/todo;
# D has no guard, so this host disable is D's mechanism). B/C re-mount
# goal/todo agent-plane (planning ON); C constructively disables plan-mode
# (G1 Q1); B_core has no plan-mode. B+plan-mode (G1 Q11 Level-2) would
# re-mount plan-mode agent-plane, overriding this host disable — the same way
# B/C re-mount goal/todo.
- id: tool-goal
  disabled: true
- id: tool-todo
  disabled: true
- id: plan-mode
  disabled: true

# No Code Mode: the data agent presents the native tool set only. Over base
# this matches the default; composed via --patch over headless/web-app it
# overrides their env-controlled DSH_TOOLS_MODE seam, holding Code Mode off.
- id: tools
  config:
    mode: native

# ── LLM: DashScope as the data-agent's direct LLM (P2 resolved) ───────────
# llm-dashscope mounts the `dashscope` provider on ctx.llm; other providers
# (deepseek-official, llm-pi-ai from base) stay mounted + configurable, so a
# user can switch via the settings UI. agent-default-model sets the profile's
# default to dashscope/qwen-plus; override per-request or via settings.
- insert:
    - id: llm-dashscope
      name: '@deepseek-ai/dsh-llm-dashscope'

- id: agent-default-model
  config:
    provider: dashscope
    model: qwen-plus

# ── identity seam (G3b: per-user caller identity; audit + subagent-qoder inject it;
# P9b populates login; stub `current()` returns `undefined` → T1 fallback today) ──
# Without this mount, `audit`'s `static inject=['identity']` leaves its fiber PENDING
# (no provider) → audit hooks never register → no audit records.
- insert:
    - id: identity
      name: '@deepseek-ai/dsh-identity'

