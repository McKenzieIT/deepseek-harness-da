# The dsh-data-agent bundle patch: a patch layer over dsh-base for the
# data-agent profile. It is additive-only — it disables the code-agent
# surface (disable, never delete, so an upstream base reorder cannot
# re-mount it) and mounts the data capability plugins this profile ships
# (P4-P11). The placeholder-only era is over: the packages below have
# shipped, so their insert rows are LIVE. Only opt-in / deployment-choice
# rows (embedder, retrieval, subagent-qoder) stay commented — uncomment
# + mount a provider to activate those seams; a bare specifier to a
# not-yet-shipped package still breaks pnpm install and verify-cordis-config.
#
# A patch targets a row by id and replaces its whole `config`; `disabled` is
# an entry flag, so `- id: <row> disabled: true` deactivates a base row
# without touching its package, its source, or the base patch. Disabling
# rather than deleting is deliberate (the base is shared): a row absent
# from this overlay would silently reappear if base's row order changed,
# while a `disabled: true` here holds regardless of composition order.
#
# The package has no runtime API; the profile composer resolves this patch
# through the `dsh.bundle.patch` manifest field. Inspect the composed tree:
#   dsh --profile headless --patch ./packages/bundle/data-agent/cordis.patch.yml --dump-config
# A standalone data-agent profile is created out-of-tree through
# `dsh plugin --profile data-agent add @deepseek-ai/dsh-data-agent` once the
# four-phase preset (P7) and its driver land; this bundle touches no shared
# boot glue, preserving the upstream upgrade path.

# ── disable the code-agent surface (map Q2: disable-only, not delete) ────────
# The data agent answers data questions (NL->SQL); it does not edit code or
# iterate build scripts, so the coding-agent tools stay off. `tool-pwsh` is
# already gated off on POSIX by base's own platform guard, so this layer does
# not restate it. `tool-bash` and `code-runtime` are execution backends the
# data agent itself uses (map Q9); they stay enabled here and are gated from
# business users at the P10 intranet tool-gate, not in this bundle.

- id: tool-str-replace-editor
  disabled: true

- id: tool-ralph
  disabled: true

# ── planning-OFF host disable (G1c variant toggle) ─────────────────────────
# goal/todo + plan-mode are host-mounted by base; the data-agent bundle
# host-disables them so A/D are clean planning-OFF controls (A is also
# planning-OFF via the phase-gate guard rejecting non-whitelisted goal/todo;
# D has no guard, so this host disable is D's mechanism). B/C re-mount
# goal/todo agent-plane (planning ON); C constructively disables plan-mode
# (G1 Q1); B_core has no plan-mode. B+plan-mode (G1 Q11 Level-2) would
# re-mount plan-mode agent-plane, overriding this host disable — the same way
# B/C re-mount goal/todo.
- id: tool-goal
  disabled: true
- id: tool-todo
  disabled: true
- id: plan-mode
  disabled: true

# No Code Mode: the data agent presents the native tool set only. Over base
# this matches the default; composed via --patch over headless/web-app it
# overrides their env-controlled DSH_TOOLS_MODE seam, holding Code Mode off.
- id: tools
  config:
    mode: native

# ── LLM: deployment choice (not bundled) ──────────────────────────────────
# The data-agent is LLM-agnostic: it consumes ctx.llm (provided by dsh-base)
# without mandating a specific provider. The LLM provider (e.g. llm-dashscope
# for AGA, or deepseek-official from base) and agent-default-model are
# DEPLOYMENT decisions — configure them via:
#   dsh plugin --profile <name> add @deepseek-ai/dsh-llm-dashscope
#   ~/.dsh/settings.yaml  agent-default-model: { provider: aga, model: qwen3.7-max }
# See scripts/setup-da-profile.sh for the reproducible setup.

# ── identity seam (G3b → P9b: real per-user identity via dsh-admin) ──────────
# P9b's dsh-admin provides the real IdentityService (overrides the stub's
# `current()` → reads login session). The stub is disabled here; admin
# provides identity itself when it mounts.
- id: identity
  disabled: true

# ── agent presets: config override (select data-agent as default preset).
# web-app and base may already mount agent-presets; this override only sets
# the default without re-inserting the row (avoids duplicate id on composition).
- id: agent-presets
  config:
    default: data-agent

# ── preset-autojoin (§4.2 da wrapper): hooks agent/created → joins the
# default preset (data-agent) to ANY published agent, so the headless
# entry — whose setup calls installModelSelection but NOT presets.mount —
# still gets the data-agent persona + 4 data tools. inject: ['agentPresets']
# makes Cordis start this row after the roster above, regardless of order.
- insert:
    - id: preset-autojoin
      name: '@deepseek-ai/dsh-preset-autojoin'

# ── data capability plugins (additive mounts; TODO, filled by P4-P11) ───────
# Each row below is a placeholder for a data capability plugin this bundle
# will mount once its package exists. They are commented out because a bare
# specifier (name: '@deepseek-ai/dsh-<pkg>') to a not-yet-shipped package
# breaks pnpm install and verify-cordis-config today; uncomment and supply
# each `name:` only after the package ships. ids and ctx keys follow the map
# Decisions so far; package names are TBD per the resolving ticket.
#
- insert:
#     # ── query (P4) ───────────────────────────────────────────────────────
    - id: query-engine        # ctx.query seam — mount ONLY the concrete query provider: it extends QueryEngine and registers ctx.query on instantiation; the abstract seam (dsh-query) is pulled transitively as the provider's peerDep, mounting it would instantiate a broken abstract service. Mirrors llm-dashscope mounting only the provider, not the dsh-llm seam.
      name: '@deepseek-ai/dsh-query-maxcompute'
      config:
        # P4c/P4d: the maxc sidecar self-manages engine auth in its config file
        # (--maxc-config), so the da does NOT push engine creds. credMode:
        # sidecar-self tells the Provider to skip the ctx.credentials
        # pushCredentials pre-check (P4d (b); maxc's config is the single
        # source of auth).
        # S1 decouple: sidecarPath is the dev sidecar; maxcConfigPath defaults
        # to ~/.maxc/config.yaml (tilde-expanded at runtime by the provider).
        # Override via deployment cordis.yml for non-standard paths.
        sidecarPath: ./packages/query/query-maxcompute/dev/maxc-sidecar.mjs
        credMode: sidecar-self
        maxcConfigPath: ~/.maxc/config.yaml
        # C: the engine project where the K11 DWS/event tables actually live
        # (ieu_cdm). Supersedes the misread config.yaml project.name
        # (game_10000251 — a game scope id, NOT an engine project) that
        # qualified DAU's table as game_10000251.dws_... which the engine could
        # not find. qualifyTable on the query provider reads this; the
        # semantic layer no longer qualifies.
        defaultProject: ieu_cdm
        # rbi §3 阶段D true-timeout: the DAU query (full event_view
        # partition scan over 7 days + GET_JSON_OBJECT) takes >60s on real
        # engine execution, so the Provider Config default 60_000 times out the MCP
        # tools/call → -32001 → no rows. 300_000 (300s) lets the heavy scan
        # finish; this is the only timeout knob in the prototype (the
        # engine-wrapper TimeoutGuard/abort-signal is deferred A1-split).
        toolCallTimeoutMs: 300000
#     # ── Postgres engine swap (GT2-D5) ─────────────────────────────────────
#     # Additive note: the active engine stays MaxCompute (row above). To
#     # swap to Postgres, comment out the dsh-query-maxcompute block above
#     # (the whole - id: query-engine row + its config) and uncomment the
#     # alternative below — same ctx.query seam id, different provider
#     # package. The Postgres provider mounts the same ctx.query seam; only
#     # the provider package + its config change — engine-neutral tooling
#     # (query-tool, nl2sql-engine, semantic-layer) is unaffected. NOTE:
#     # @deepseek-ai/dsh-query-postgres is a GT2-D4 stub today (conventions
#     # only; execute/attach/cancel/getProgress throw not-implemented), so
#     # this swap is illustrative until the PG driver lands.
#     - id: query-engine
#       name: '@deepseek-ai/dsh-query-postgres'
#       config:
#         credMode: sidecar-self
#         # Postgres connection config (host/db/user/password) goes here
#     # ── retrieval / vectorization (P5) ───────────────────────────────────
#     - id: embedder            # ctx.embedder seam — OPT-IN (P5b shipped @deepseek-ai/dsh-embedder-fakehash default zero-dep + dsh-embedder-http external OpenAI-compat; T2: AGA-embeddings NO, user self-deploys the heavy embedder). Uncomment + mount a provider to register ctx.embedder. Left commented: activation (hybrid-by-default vs the local Bm25Linker) is D2c's evals-driven keep/regress call; an unmounted seam keeps search_data_sources on its Bm25Linker default (no behavior change, P13b 9/9 unaffected).
#       name: '@deepseek-ai/dsh-embedder-fakehash'
#     - id: retrieval          # ctx.retrieval seam — OPT-IN (P5b shipped @deepseek-ai/dsh-retrieval-inproc hybrid BM25+vec+RRF k=60 over ctx.embedder, InferenceError->BM25-only degradation; reranker peer after RRF). Uncomment + mount (alongside an embedder provider) to swap search_data_sources off the local Bm25Linker (additive, RetrievalLinker contract unchanged). Left commented pending D2c keep/regress.
#       name: '@deepseek-ai/dsh-retrieval-inproc'
#     # ── scope registry (P1) ──────────────────────────────────────────
#     # Per-scope namespace registry (ctx.scopes). semantic-layer delegates its
#     # semanticRoot/scopeId to the active scope here, so each scope's semantic
#     # layer loads in isolation; the active scope is runtime-mutable via the
#     # registry file below (CLI/API/Web UI). Unmounted or no active scope =>
#     # semantic-layer falls back to its static semanticRoot (no behavior change).
#     # P1 wiring. The token→scope binding + access gate (P9, mid-term) is NOT
#     # yet wired, so per-query/per-tenant scope selection is a process-global
#     # active-scope switch today — not automatic per question.
    - id: scope-registry
      name: '@deepseek-ai/dsh-scope-registry'
      config:
        # quoted: '~' is YAML's null indicator, so the path must be a quoted
        # string for scope-registry to receive it verbatim and expand '~/'.
        registryPath: '~/.dsh/data/scopes.yaml'
#     # ── semantic layer (P6) - first-class (map: 语义层一等公民) ───────────
    - id: semantic-layer     # in-process core capability (loaders + tables); engine schema read decoupled to the query engine
      name: '@deepseek-ai/dsh-semantic-layer'
      config:
        # K11 dev default + per-scope fallback: the semantic-layer root carrying
        # the K11 event_view corpus. Now that scope-registry (above) is mounted,
        # semanticRoot delegates to the active scope's root when a scope is
        # active; this static value is the fallback when no scope is active (so
        # the unscoped K11 default keeps working unchanged).
        semanticRoot: ./examples/k11-semantic-layer
    - id: enrichment-llm-wiring  # wire ctx.llm into ctx.schema enrichment (F1: production two-round discovery)
      name: '@deepseek-ai/dsh-semantic-layer/src/llm-wiring-plugin.ts'
    - id: schema-gateway      # W1: read-only Remote projection of ctx.schema for client UI consumption
      name: '@deepseek-ai/dsh-schema-gateway'
    - id: evidence-query      # W4: unified evidence-query layer (coverage/gap/eval-result)
      name: '@deepseek-ai/dsh-evidence-query'
      config:
        resultsDir: .tmp/eval-results
    - id: evidence-query-gateway  # W8: RPC gateway for evidence-query (TypertRemoteService)
      name: '@deepseek-ai/dsh-evidence-query/src/gateway.ts'
    - id: ui-context-layer    # W10: knowledge-graph fullscreen overlay (client plugin). Provides
                              # ctx.contextLayer + the shell.overlay seat. Ordered BEFORE
                              # ui-semantic-layer, which reads `contextLayer` to decide whether to
                              # offer the "view in graph" entry on AssetDetail.
      name: '@deepseek-ai/dsh-client-ui-context-layer'
    - id: ui-semantic-layer   # W5: semantic layer management UI (client plugin)
      name: '@deepseek-ai/dsh-client-ui-semantic-layer'
    - id: eval-runner-service # W6a-gap: wire the ctx.evalRunner seam — activates trigger_eval full_run + the ③ goal-eval-policy no-progress backstop. Drives the real Nl2sqlEngine (ctx.llm + ctx.query) over the K11 case set, persists JSONL for evidence-query, tracks last/last-two runs for delta. inject ['llm'] + optional ['query','nl2sql','schema'] — degrades to all-fail verdicts when a seam is unmounted, never crashes the bundle.
      name: '@deepseek-ai/dsh-eval-runner-service'
      config:
        caseDir: ./packages/eval/eval/cases/k11
        resultsDir: .tmp/eval-results
        passK: 3
        # R8 (PB-COMPLY): eval LLM gateway — explicit, no silent vendor default
        # (runBatch fails loud if omitted). Deployment overlays can override.
        provider: aga
        model: qwen3.7-max
    - id: goal-eval-policy   # W6a: no-progress backstop — counts rounds, triggers eval every K=3, blocks after N=3 consecutive no-improvement
      name: '@deepseek-ai/dsh-goal-eval-policy'
      config:
        goalEvalIntervalRounds: 3
        noProgressThreshold: 3
    - id: goal-eval-context  # W6b: inject <eval_evidence> XML into agent system prompt when goal active
      name: '@deepseek-ai/dsh-goal-eval-context'
#     # ── audit (P8) ───────────────────────────────────────────────────────
    - id: audit              # guard/session-event + tool-audit + ctx.audit (own node:sqlite; P8b)
      name: '@deepseek-ai/dsh-audit'
      config:
        path: !!js dshHomePath('storages/audit/audit.db')
    - id: nl2sql-engine      # ctx.nl2sql seam (NL→SQL engine: BM25 linking + prompt + critic + eval-gate; P13b)
      name: '@deepseek-ai/dsh-nl2sql-engine'
    # ── admin + access isolation (P9b) ────────────────────────────────────
    - id: admin              # per-user login + identity + PAT self-service + authz gate
      name: '@deepseek-ai/dsh-admin'
#     # ── LLM (phase-1) — MOVED to deployment layer ─────────────────────────
#     # llm-dashscope and subagent-qoder are deployment choices, not product
#     # capabilities. Mount them via `dsh plugin --profile <name> add <pkg>`.
#     # See scripts/setup-da-profile.sh.
#     - id: subagent-qoder     # Qoder as a harness subagent (query() delegation; PAT auth via credentials seam)
#       name: '@deepseek-ai/dsh-subagent-qoder' # name TBD - P3

# ── transform execution (TODO, P7 four-phase + report/Excel) ───────────────
# code-runtime runs pandas transforms (incl. Excel/report generation via
# pandas) and is mounted here as the data-python variant.
#
    - id: result-cache-memory   # ctx.resultCache seam — in-memory session-scoped Provider; tools/post-execute hook captures query_data results with qr_ prefix; compute tool stores derived results with cr_ prefix. Id is NOT `result-cache`: base's web-app bundle already mounts the
                                # client-side object cache (`@deepseek-ai/dsh-client-result-cache`)
                                # under that id, and two rows sharing a loader entry id abort the
                                # whole include group (cold-boot failure).
      name: '@deepseek-ai/dsh-result-cache-memory'

# ── code-runtime: disable headless's worker-thread, insert data-python ──────
# The headless bundle mounts code-runtime (worker-thread); the data agent needs
# the data-python variant for pandas transforms. Disable + insert (different ids
# aren't needed — disabled: true suppresses the original, the insert below adds
# the replacement under the same conceptual role).
- id: code-runtime
  disabled: true

- insert:
    - id: code-runtime-data-python
      name: '@deepseek-ai/dsh-code-runtime-data-python'
