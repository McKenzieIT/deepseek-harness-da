input:
  question: 昨天充值总金额是多少（事件级，排除沙盒）？
  scope_id: '10000251'
expected:
  sql: |-
    SELECT SUM(CAST(GET_JSON_OBJECT(params, '$.money') AS DOUBLE)) AS total_recharge
    FROM ieu_ods.ods_10000251_all_view
    WHERE ds = '{{ds_yesterday}}'
      AND event = 'game.recharge'
      AND GET_JSON_OBJECT(params, '$.moneyType') = '1'
      AND (GET_JSON_OBJECT(params, '$.sandbox') IS NULL OR GET_JSON_OBJECT(params, '$.sandbox') != '1')
