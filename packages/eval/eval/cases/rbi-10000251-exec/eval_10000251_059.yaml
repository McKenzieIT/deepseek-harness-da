schema_version: 3
case_id: eval_10000251_059
input:
  question: 昨天各付费金额段（0-10元/10-100元/100-1000元/1000元以上）的付费人数？
  scope_id: '10000251'
expected:
  sql: |-
    SELECT
      CASE
        WHEN pay_amt/100.0 <= 10 THEN '0-10元'
        WHEN pay_amt/100.0 <= 100 THEN '10-100元'
        WHEN pay_amt/100.0 <= 1000 THEN '100-1000元'
        ELSE '1000元以上'
      END AS pay_band,
      COUNT(DISTINCT role_id) AS paying_roles,
      SUM(pay_amt) / 100.0 AS total_yuan
    FROM ieu_cdm.dws_10000251_com_pay_order_di
    WHERE ds = '{{ds_yesterday}}'
      AND pay_type = 1
    GROUP BY
      CASE
        WHEN pay_amt/100.0 <= 10 THEN '0-10元'
        WHEN pay_amt/100.0 <= 100 THEN '10-100元'
        WHEN pay_amt/100.0 <= 1000 THEN '100-1000元'
        ELSE '1000元以上'
      END
    ORDER BY MIN(pay_amt)
  result_value:
    value:
    - pay_band: 0-10元
      paying_roles: 139
      total_yuan: 885.0
    - pay_band: 10-100元
      paying_roles: 92
      total_yuan: 5478.0
    - pay_band: 100-1000元
      paying_roles: 4
      total_yuan: 1372.0
  behavior: direct_answer
  match_mode: scalar_exact
