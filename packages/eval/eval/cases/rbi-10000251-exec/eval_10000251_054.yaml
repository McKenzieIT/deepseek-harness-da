schema_version: 3
case_id: eval_10000251_054
input:
  question: 最近7天每天新增角色数及其次日留存率？
  scope_id: '10000251'
expected:
  sql: |-
    SELECT a.ds AS cohort_ds,
      COUNT(DISTINCT a.user_id) AS new_roles,
      COUNT(DISTINCT b.user_id) AS d1_retained,
      COUNT(DISTINCT b.user_id) * 1.0 / COUNT(DISTINCT a.user_id) AS d1_retention
    FROM ieu_cdm.dws_10000251_univ_role_act_di a
    LEFT JOIN ieu_cdm.dws_10000251_univ_role_act_di b
      ON a.user_id = b.user_id
      AND b.ds = TO_CHAR(DATEADD(TO_DATE(a.ds, 'yyyymmdd'), 1, 'dd'), 'yyyymmdd')
      AND b.act = 1
    WHERE a.ds BETWEEN '{{ds_7d_ago}}' AND '{{ds_yesterday}}'
      AND a.act_fst = 1
    GROUP BY a.ds
    ORDER BY a.ds
