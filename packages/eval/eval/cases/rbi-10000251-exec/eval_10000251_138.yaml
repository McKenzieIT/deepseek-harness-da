input:
  question: 昨天新增且当天就充值的角色有多少个？
  scope_id: '10000251'
expected:
  sql: |
    SELECT COUNT(DISTINCT a.role_id) AS new_and_recharged_cnt
    FROM (SELECT DISTINCT role_id FROM ieu_ods.ods_10000251_all_view WHERE event = 'game.role.create' AND ds = '{{ds_yesterday}}') a
    JOIN (SELECT DISTINCT role_id FROM ieu_ods.ods_10000251_all_view WHERE event = 'game.recharge' AND ds = '{{ds_yesterday}}'
      AND CAST(GET_JSON_OBJECT(params, '$.money') AS BIGINT) > 0) b
      ON a.role_id = b.role_id
