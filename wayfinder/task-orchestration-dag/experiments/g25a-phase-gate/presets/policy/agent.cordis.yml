# G25a policy-only arm: an ordinary Agent loop with deterministic query admission.
#
# No phase enum, no phase index, no phase prompt substitution, no automatic
# advance, no fallback, no phase-scoped tool whitelist. `guardrails-policy`
# enforces exactly four admission rules before `query_data` may run:
#   1. a successful load_table_definition or load_event_definition first
#   2. critique_sql_tool confidence >= 0.6 for the SQL about to run
#   3. evaluate_sql_quality score >= 60 for that same SQL
#   4. the SQL handed to query_data equals the last SQL that cleared 2 and 3
# Query errors go straight back to the model; the plugin injects nothing.
#
# GENERATED by presets/generate-presets.mjs — do not hand-edit. The persona is
# phase-gate's BASE_PERSONA verbatim so persona is not a variable across arms.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: "You are a data agent for a per-game analytics platform. You answer natural-language data questions over a semantic layer (events/tables/terminology) by running a four-phase pipeline: UNDERSTANDING → GENERATION → EXECUTION → INTERPRETATION. Follow the per-phase instructions injected at runtime. If you cannot answer, emit a honest decline (the 【incomplete】 marker in INTERPRETATION); never fabricate tables, fields, or results.\n\nThree rules you must always follow:\n1. PHASE ORDER (strict): UNDERSTANDING calls search_data_sources + load_*definition + present_clarification. GENERATION writes SQL and does NOT call query_data. EXECUTION calls query_data. INTERPRETATION calls present_*. query_data is EXECUTION-only — never call it in UNDERSTANDING or GENERATION before the SQL is written and critiqued.\n2. EVENT vs TABLE loader: events (ods_* tables or event names like game.role.online) → load_event_definition; DWS tables (dws_*) → load_table_definition. Pick the loader by the candidate's mode/type returned by search_data_sources; never call load_table_definition with an event name (it will not find it).\n3. ROUTE: at the end of UNDERSTANDING (after search + load), emit exactly one token — 【route:proceed】 (search returned candidates + you loaded definitions + no ambiguity), 【route:clarify】 (real ambiguity — also call present_clarification with one specific question), or 【route:decline】 (no candidates / unanswerable). If search returned candidates and you loaded the definitions, you have grounding — emit 【route:proceed】; do not prematurely clarify or decline."

# The critic-context provider and its two consumer tools share one isolate
# realm. This is not optional: a row publishing a service into the root realm
# is rejected by dsh-agent-presets' leakedServices guard and the preset never
# joins, and a consumer left outside the realm resolves a root realm this
# preset never populated, so ctx.get('criticCtx') returns undefined, every
# referenced table is flagged table_not_in_candidates, confidence lands at or
# below 0.5, and query admission never opens.
- id: critic-context
  name: cordis:group
  group: true
  isolate:
    criticCtx: true
  config:
    - id: guardrails-policy
      name: '../../src/guardrails-policy.ts'
      config:
        enforce_admission: true
    - id: tool-critique-sql
      name: '@deepseek-ai/dsh-tool-critique-sql'
    - id: tool-evaluate-sql-quality
      name: '@deepseek-ai/dsh-tool-evaluate-sql-quality'

# Loose rows: these publish no service, so a realm around them would hide the
# host tools/schema/query instances they resolve.
- id: tool-scope-routing   # list_scopes + switch_scope
  name: '@deepseek-ai/dsh-tool-scope-routing'
- id: tool-search-data-sources   # search_data_sources
  name: '@deepseek-ai/dsh-tool-search-data-sources'
- id: tool-load-table-definition   # load_table_definition
  name: '@deepseek-ai/dsh-tool-load-table-definition'
- id: tool-load-event-definition   # load_event_definition
  name: '@deepseek-ai/dsh-tool-load-event-definition'
- id: tool-update-table-config   # update_table_config
  name: '@deepseek-ai/dsh-tool-update-table-config'
- id: tool-present-clarification   # present_clarification
  name: '@deepseek-ai/dsh-tool-present-clarification'
- id: tool-resolve-term   # resolve_term
  name: '@deepseek-ai/dsh-tool-resolve-term'
- id: tool-query-data   # query_data
  name: '@deepseek-ai/dsh-query-tool'
- id: tool-present-decomposition   # present_decomposition
  name: '@deepseek-ai/dsh-tool-present-decomposition'
- id: tool-present-table   # present_table
  name: '@deepseek-ai/dsh-tool-present-table'
- id: tool-suggest-followups   # suggest_followups
  name: '@deepseek-ai/dsh-tool-suggest-followups'
- id: tool-compute   # compute
  name: '@deepseek-ai/dsh-tool-compute'
