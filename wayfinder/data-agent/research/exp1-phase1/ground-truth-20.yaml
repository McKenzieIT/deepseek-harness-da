- table_name: dws_10000251_acc_summary_df
  complexity: high
  col_count: 69
  ground_truth:
    kind: dws
    primary_key: [account_id, ds]
    label_columns: []
    freshness: daily_snapshot
    column_role_issues:
      - col: os_id
        type: int
        current_role: dimension
        correct_role: dimension
        heuristic_would_say: dimension  # ends with _id
        note: correct — _id suffix catches this
  heuristic_output:
    kind: ~  # generateTableYaml does not infer kind
    primary_key: ~  # not inferred for DWS
    label_columns: ~  # not inferred for DWS
    freshness: ~  # not inferred for DWS
  heuristic_correct:
    kind: false  # not inferred
    primary_key: false  # not inferred
    label_columns: true  # N/A — no labels expected, none inferred
    freshness: false  # not inferred

