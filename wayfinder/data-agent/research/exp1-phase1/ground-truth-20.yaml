# ═══════════════════════════════════════════════════════════════════
# SUMMARY
# ═══════════════════════════════════════════════════════════════════
#
# Heuristic accuracy across 20 tables:
#
#   Field            Correct   Incorrect   N/A or Partial   Accuracy
#   ─────────────    ───────   ─────────   ──────────────   ────────
#   kind (DWS)       0         10          0                0%   (not inferred at all)
#   kind (DIM)       10        0           0                100% (always dim, always correct)
#   primary_key (DWS) 0        10          0                0%   (not inferred at all)
#   primary_key (DIM) 4         6          0                40%  (simple _id PKs caught; composite/bare-id missed)
#   label_columns (DWS) 10     0           0                100% (no labels expected, none inferred)
#   label_columns (DIM) 5      5           0                50%  (suffix-based: _name works; "name"/"event"/"domain"/numbered suffixes missed)
#   freshness (DWS)  0         10          0                0%   (not inferred at all)
#   freshness (DIM)  6         4           0                60%  (static correct for non-partitioned; wrong for _df/_arch partitioned dims)
#
# Key failure modes:
#   1. DWS tables: zero inference for PK/kind/freshness — all metadata must be manually set or LLM-inferred
#   2. Composite PKs: heuristic only picks first *_id column, missing multi-column keys
#   3. Non-_id PKs: bare "id", "code", "type+value" composites all missed
#   4. Label columns with non-standard names: "name" (not "_name"), "event", "domain", numbered suffixes
#   5. Freshness for partitioned DIM tables: _df/_arch patterns indicate daily snapshots, not static
#   6. Column roles: INT/BIGINT type codes (user_type, pvp_type, pay_type, card_job) misclassified as measure
#   7. Kind misclassification: dws_active_code_info is semantically a DIM table despite dws_ prefix
