# GA-EXP1 Phase 1 — Ground Truth Annotations (20 tables)
# Annotated: 2026-09-01
# Method: manual review of YAML definitions + column semantics + heuristic code analysis
#
# Heuristic code: packages/data/semantic-layer/src/io.ts
#   inferRole: ds/dt/date→dimension, *_id→dimension, MEASURE_TYPE+MEASURE_SUFFIX→measure, STRING→dimension, MEASURE_TYPE→measure, else→attribute
#   generateDimYaml: PK=first *_id col, labels=STRING cols ending _name/_desc/_label/_title, kind=dim, freshness=static_reference
#   generateTableYaml: no PK/labels/kind/freshness inference
#
# MEASURE_TYPES: BIGINT, INT, DOUBLE, FLOAT, DECIMAL
# MEASURE_SUFFIXES: _count, _cnt, _sum, _amt, _amount, _avg, _total, _num
# LABEL_SUFFIXES: _name, _desc, _label, _title

# ═══════════════════════════════════════════════════════════════════
