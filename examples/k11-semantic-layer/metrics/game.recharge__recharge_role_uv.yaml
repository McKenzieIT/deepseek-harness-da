kind: metric
name: game.recharge__recharge_role_uv
description: 充值独立角色数(去重 role_id,含全部 moneyType;D18已过滤money<=0的零金额打点噪声)
domains:
  - 付费经济
computation:
  sql: COUNT(DISTINCT CASE WHEN CAST(GET_JSON_OBJECT(params, '$.money') AS BIGINT) > 0 THEN role_id END)
  metadata:
    aggregation: count_distinct
    field: CASE WHEN CAST(GET_JSON_OBJECT(params, '$.money') AS BIGINT) > 0 THEN role_id END
    source: game.recharge
    time_grain: ""
relations:
  - type: derived_from
    target: game.recharge
    description: 机械提取自 game.recharge 的 metrics 块（key=recharge_role_uv）
