kind: metric
name: game.battlepass.levelup__battlepass_levelup_premium_role_rate
description: 高级/珍藏版战令升级角色占全部战令升级角色比例（NULLIF 防除零）
domains:
  - 角色成长
computation:
  sql: CAST(COUNT(DISTINCT CASE WHEN CAST(GET_JSON_OBJECT(params, '$.enabledStatus') AS BIGINT) >= 1 THEN role_id END) AS DOUBLE) / NULLIF(CAST(COUNT(DISTINCT role_id) AS DOUBLE), 0)
  metadata:
    aggregation: ""
    field: ""
    source: game.battlepass.levelup
    time_grain: ""
relations:
  - type: derived_from
    target: game.battlepass.levelup
    description: 机械提取自 game.battlepass.levelup 的 metrics 块（key=battlepass_levelup_premium_role_rate）
