kind: metric
name: dws_10000251_univ_acc_whole_df__churn_acc_cnt
description: 流失账号数(近 30 天未活跃,act_tm_lst 早于 ds-30 天的账号去重数;ds 用 TO_DATE 转换,CAST(ds AS TIMESTAMP) 会返回 NULL)
domains:
  - 用户生命周期
  - 付费经济
computation:
  sql: COUNT(DISTINCT CASE WHEN act_tm_lst IS NOT NULL AND DATEDIFF(TO_DATE(ds,'yyyyMMdd'), act_tm_lst, 'dd') > 30 THEN user_id END)
  metadata:
    aggregation: count_distinct
    field: CASE WHEN act_tm_lst IS NOT NULL AND DATEDIFF(TO_DATE(ds,'yyyyMMdd'), act_tm_lst, 'dd') > 30 THEN user_id END
    source: dws_10000251_univ_acc_whole_df
    time_grain: ""
relations:
  - type: derived_from
    target: dws_10000251_univ_acc_whole_df
    description: 机械提取自 dws_10000251_univ_acc_whole_df 的 metrics 块（key=churn_acc_cnt）
