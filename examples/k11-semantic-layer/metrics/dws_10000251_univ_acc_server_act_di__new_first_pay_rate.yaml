  - 付费经济
computation:
  sql: SUM(pay_fst)*1.0/NULLIF(SUM(act_fst),0)
  metadata:
    aggregation: sum
    field: pay_fst)*1.0/NULLIF(SUM(act_fst),0
    source: dws_10000251_univ_acc_server_act_di
    time_grain: ""
