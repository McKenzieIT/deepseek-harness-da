kind: metric
name: dws_10000251_univ_dev_server_whole_df__active_to_pay_lag_days
description: 付费设备从首次活跃到首次付费的平均间隔天数，反映付费转化速度。仅对有付费记录(pay_amt_std>0)且 act_tm_fst 非空的设备计算；未付费设备 pay_tm_fst 为 1970 哨兵值须排除，否则会出现负值。
domains:
  - 付费经济
  - 用户生命周期
computation:
  sql: AVG(CASE WHEN pay_amt_std > 0 THEN DATEDIFF(pay_tm_fst, act_tm_fst, 'dd') END)
  metadata:
    aggregation: avg
    field: CASE WHEN pay_amt_std > 0 THEN DATEDIFF(pay_tm_fst, act_tm_fst, 'dd') END
    source: dws_10000251_univ_dev_server_whole_df
    time_grain: ""
relations:
