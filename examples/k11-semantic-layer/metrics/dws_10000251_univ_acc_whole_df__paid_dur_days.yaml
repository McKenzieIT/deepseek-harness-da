kind: metric
name: dws_10000251_univ_acc_whole_df__paid_dur_days
description: 平均付费转化时长(天)=首次付费-首次活跃(pay_tm_fst - act_tm_fst),仅对已付费账号(须用 pay_amt_std>0 过滤;未付费账号 pay_tm_fst 为 1970-01-01 08:00:00 哨兵值而非 NULL,用 IS NOT NULL 会污染分母)
domains:
  - 用户生命周期
  - 付费经济
computation:
  sql: AVG(CASE WHEN pay_amt_std > 0 AND act_tm_fst IS NOT NULL THEN DATEDIFF(pay_tm_fst, act_tm_fst, 'dd') END)
  metadata:
    aggregation: avg
    field: CASE WHEN pay_amt_std > 0 AND act_tm_fst IS NOT NULL THEN DATEDIFF(pay_tm_fst, act_tm_fst, 'dd') END
    source: dws_10000251_univ_acc_whole_df
    time_grain: ""
relations:
