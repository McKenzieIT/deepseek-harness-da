domains:
  - 付费经济
computation:
  sql: SUM(CAST(GET_JSON_OBJECT(params,'$.buyCnt') AS BIGINT)) / NULLIF(COUNT(DISTINCT role_id), 0)
  metadata:
    aggregation: sum
    field: CAST(GET_JSON_OBJECT(params,'$.buyCnt') AS BIGINT)) / NULLIF(COUNT(DISTINCT role_id), 0
