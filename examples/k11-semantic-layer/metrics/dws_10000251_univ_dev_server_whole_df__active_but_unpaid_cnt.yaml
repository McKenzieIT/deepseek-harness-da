kind: metric
name: dws_10000251_univ_dev_server_whole_df__active_but_unpaid_cnt
description: 有活跃(act_tm_fst 非空)但未付费(pay_amt_std=0)的去重设备数，用于识别区服内未转化付费的潜在设备规模。本表未付费设备 pay_tm_fst 为哨兵值非 NULL，故用 pay_amt_std=0 判定未付费。
domains:
  - 付费经济
  - 用户生命周期
computation:
  sql: COUNT(DISTINCT CASE WHEN act_tm_fst IS NOT NULL AND pay_amt_std = 0 THEN user_id END)
  metadata:
    aggregation: count_distinct
    field: CASE WHEN act_tm_fst IS NOT NULL AND pay_amt_std = 0 THEN user_id END
    source: dws_10000251_univ_dev_server_whole_df
    time_grain: ""
relations:
  - type: derived_from
    target: dws_10000251_univ_dev_server_whole_df
    description: 机械提取自 dws_10000251_univ_dev_server_whole_df 的 metrics 块（key=active_but_unpaid_cnt）
