kind: metric
name: game.item.use__game_item_use_item_num_sum
description: 单日消耗道具总数量（按 itemNum 字段求和，反映道具消耗规模）
domains:
  - 装备道具
computation:
  sql: SUM(CASE WHEN GET_JSON_OBJECT(params, '$.itemNum') IS NOT NULL THEN CAST(GET_JSON_OBJECT(params, '$.itemNum') AS BIGINT) ELSE 0 END)
  metadata:
    aggregation: sum
    field: CASE WHEN GET_JSON_OBJECT(params, '$.itemNum') IS NOT NULL THEN CAST(GET_JSON_OBJECT(params, '$.itemNum') AS BIGINT) ELSE 0 END
    source: game.item.use
    time_grain: ""
relations:
  - type: derived_from
    target: game.item.use
    description: 机械提取自 game.item.use 的 metrics 块（key=game_item_use_item_num_sum）
