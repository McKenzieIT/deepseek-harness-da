kind: metric
name: game.report.share__report_share_world_cnt
description: 分享至世界频道的次数（按事件逐条计数）
domains:
  - 系统监控
computation:
  sql: SUM(CASE WHEN CAST(GET_JSON_OBJECT(params,'$.shareWorld') AS BOOLEAN) THEN 1 ELSE 0 END)
  metadata:
    aggregation: sum
    field: CASE WHEN CAST(GET_JSON_OBJECT(params,'$.shareWorld') AS BOOLEAN) THEN 1 ELSE 0 END
    source: game.report.share
    time_grain: ""
relations:
  - type: derived_from
    target: game.report.share
    description: 机械提取自 game.report.share 的 metrics 块（key=report_share_world_cnt）
