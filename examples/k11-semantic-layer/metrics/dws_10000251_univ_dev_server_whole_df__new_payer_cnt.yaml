kind: metric
name: dws_10000251_univ_dev_server_whole_df__new_payer_cnt
description: 当日新增付费设备数（首次付费时间等于首次活跃时间，即活跃当天即付费的设备）。基于累计快照口径，识别即时转化设备；需加 pay_amt_std>0 前置过滤排除未付费哨兵行。
domains:
  - 付费经济
  - 用户生命周期
computation:
  sql: COUNT(DISTINCT CASE WHEN pay_amt_std > 0 AND pay_tm_fst = act_tm_fst THEN user_id END)
  metadata:
    aggregation: count_distinct
    field: CASE WHEN pay_amt_std > 0 AND pay_tm_fst = act_tm_fst THEN user_id END
    source: dws_10000251_univ_dev_server_whole_df
    time_grain: ""
relations:
  - type: derived_from
    target: dws_10000251_univ_dev_server_whole_df
    description: 机械提取自 dws_10000251_univ_dev_server_whole_df 的 metrics 块（key=new_payer_cnt）
