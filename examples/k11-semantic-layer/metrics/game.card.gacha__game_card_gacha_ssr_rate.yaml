kind: metric
name: game.card.gacha__game_card_gacha_ssr_rate
description: SSR 出货率 = SSR 累计数 / 累计抽卡次数（NULLIF 防零除）
domains:
  - 探索收集
computation:
  sql: SUM(CAST(GET_JSON_OBJECT(params,'$.ssrCnt') AS BIGINT)) / NULLIF(SUM(CAST(GET_JSON_OBJECT(params,'$.gachaTimes') AS BIGINT)),0)
  metadata:
    aggregation: sum
    field: CAST(GET_JSON_OBJECT(params,'$.ssrCnt') AS BIGINT)) / NULLIF(SUM(CAST(GET_JSON_OBJECT(params,'$.gachaTimes') AS BIGINT)),0
    source: game.card.gacha
    time_grain: ""
relations:
  - type: derived_from
    target: game.card.gacha
    description: 机械提取自 game.card.gacha 的 metrics 块（key=game_card_gacha_ssr_rate）
