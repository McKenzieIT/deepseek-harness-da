kind: metric
name: game.recharge__recharge_cnt
description: 充值事件触发次数(含 moneyType=1/2 全部;D18已过滤money<=0的零金额打点噪声,该噪声只出现在moneyType=1且orderId为空的行,不影响moneyType=2)
domains:
  - 付费经济
computation:
  sql: COUNT(CASE WHEN CAST(GET_JSON_OBJECT(params, '$.money') AS BIGINT) > 0 THEN 1 END)
  metadata:
    aggregation: count
    field: CASE WHEN CAST(GET_JSON_OBJECT(params, '$.money') AS BIGINT) > 0 THEN 1 END
    source: game.recharge
    time_grain: ""
relations:
  - type: derived_from
    target: game.recharge
    description: 机械提取自 game.recharge 的 metrics 块（key=recharge_cnt）
