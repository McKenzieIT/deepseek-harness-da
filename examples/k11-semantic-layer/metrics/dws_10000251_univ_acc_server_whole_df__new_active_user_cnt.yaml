kind: metric
name: dws_10000251_univ_acc_server_whole_df__new_active_user_cnt
description: 当日新增活跃账号数(首次活跃时间落在快照日的账号去重数)；用于评估当日拉新效果。注意 ds 为 yyyymmdd 需转为 yyyy-mm-dd 再比较(见 daily_active_user_cnt)
domains:
  - 用户生命周期
  - 付费经济
computation:
  sql: COUNT(DISTINCT CASE WHEN act_tm_fst IS NOT NULL AND SUBSTR(CAST(act_tm_fst AS STRING),1,10) = CONCAT(SUBSTR(ds,1,4),'-',SUBSTR(ds,5,2),'-',SUBSTR(ds,7,2)) THEN user_id END)
  metadata:
    aggregation: count_distinct
    field: CASE WHEN act_tm_fst IS NOT NULL AND SUBSTR(CAST(act_tm_fst AS STRING),1,10) = CONCAT(SUBSTR(ds,1,4),'-',SUBSTR(ds,5,2),'-',SUBSTR(ds,7,2)) THEN user_id END
    source: dws_10000251_univ_acc_server_whole_df
    time_grain: ""
relations:
  - type: derived_from
    target: dws_10000251_univ_acc_server_whole_df
    description: 机械提取自 dws_10000251_univ_acc_server_whole_df 的 metrics 块（key=new_active_user_cnt）
