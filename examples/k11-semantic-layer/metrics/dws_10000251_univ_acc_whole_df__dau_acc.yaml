kind: metric
name: dws_10000251_univ_acc_whole_df__dau_acc
description: 指定 ds 当日活跃账号数(act_tm_lst 落在 ds 当日,基于最近活跃时点近似;ds 为 yyyyMMdd 字符串,用 TO_DATE 转换,CAST(ds AS TIMESTAMP) 因类型未启用且格式无连字符会返回 NULL)
domains:
  - 用户生命周期
  - 付费经济
computation:
  sql: COUNT(DISTINCT CASE WHEN act_tm_lst IS NOT NULL AND DATEDIFF(act_tm_lst, TO_DATE(ds,'yyyyMMdd'), 'dd')=0 THEN user_id END)
  metadata:
    aggregation: count_distinct
    field: CASE WHEN act_tm_lst IS NOT NULL AND DATEDIFF(act_tm_lst, TO_DATE(ds,'yyyyMMdd'), 'dd')=0 THEN user_id END
    source: dws_10000251_univ_acc_whole_df
    time_grain: ""
relations:
  - type: derived_from
    target: dws_10000251_univ_acc_whole_df
    description: 机械提取自 dws_10000251_univ_acc_whole_df 的 metrics 块（key=dau_acc）
