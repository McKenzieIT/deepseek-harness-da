kind: metric
name: game.task.act__game_task_act_role_per_account
description: 平均每账号角色数(独立角色/独立账号；衡量多角色账号占比)
domains:
  - 角色成长
computation:
  sql: COUNT(DISTINCT role_id) / NULLIF(COUNT(DISTINCT account_id), 0)
  metadata:
    aggregation: count_distinct
    field: role_id) / NULLIF(COUNT(DISTINCT account_id), 0
    source: game.task.act
    time_grain: ""
relations:
  - type: derived_from
    target: game.task.act
    description: 机械提取自 game.task.act 的 metrics 块（key=game_task_act_role_per_account）
