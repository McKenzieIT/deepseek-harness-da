  - 用户生命周期
computation:
  sql: SUM(pay_amt_std)*1.0/NULLIF(COUNT(DISTINCT CASE WHEN pay_amt_std > 0 THEN user_id END),0)
  metadata:
    aggregation: sum
    field: pay_amt_std)*1.0/NULLIF(COUNT(DISTINCT CASE WHEN pay_amt_std > 0 THEN user_id END),0
