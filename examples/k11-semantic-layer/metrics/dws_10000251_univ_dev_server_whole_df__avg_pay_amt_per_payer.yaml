kind: metric
name: dws_10000251_univ_dev_server_whole_df__avg_pay_amt_per_payer
description: 付费设备平均累计付费金额（元/台），即付费客单价。单日快照口径，跨日需先取设备最新分区值；分母用 pay_amt_std>0 的去重设备数。
domains:
