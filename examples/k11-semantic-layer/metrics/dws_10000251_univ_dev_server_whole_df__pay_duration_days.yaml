kind: metric
name: dws_10000251_univ_dev_server_whole_df__pay_duration_days
description: 付费设备从首次付费到最近付费的平均间隔天数，反映付费生命周期跨度。仅对有付费记录(pay_amt_std>0)的设备计算，AVG 自动忽略 NULL；未付费设备的 pay_tm_fst/pay_tm_lst 为 1970 哨兵值须排除。
domains:
  - 付费经济
  - 用户生命周期
computation:
  sql: AVG(CASE WHEN pay_amt_std > 0 THEN DATEDIFF(pay_tm_lst, pay_tm_fst, 'dd') END)
  metadata:
    aggregation: avg
    field: CASE WHEN pay_amt_std > 0 THEN DATEDIFF(pay_tm_lst, pay_tm_fst, 'dd') END
    source: dws_10000251_univ_dev_server_whole_df
    time_grain: ""
relations:
  - type: derived_from
    target: dws_10000251_univ_dev_server_whole_df
    description: 机械提取自 dws_10000251_univ_dev_server_whole_df 的 metrics 块（key=pay_duration_days）
