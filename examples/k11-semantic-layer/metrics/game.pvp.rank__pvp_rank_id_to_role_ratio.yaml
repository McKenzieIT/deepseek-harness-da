kind: metric
name: game.pvp.rank__pvp_rank_id_to_role_ratio
description: 排行榜数与角色数比值（基表 role_id 退化，仅供口径诊断）
domains:
  - 战斗关卡
computation:
  sql: ROUND(COUNT(DISTINCT GET_JSON_OBJECT(params, '$.rankId')) * 1.0 / NULLIF(COUNT(DISTINCT role_id), 0), 4)
  metadata:
    aggregation: ""
    field: ""
    source: game.pvp.rank
    time_grain: ""
relations:
  - type: derived_from
    target: game.pvp.rank
    description: 机械提取自 game.pvp.rank 的 metrics 块（key=pvp_rank_id_to_role_ratio）
