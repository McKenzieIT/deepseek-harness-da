kind: metric
name: game.resort.accept__resort_accept_accepts_per_request
description: 每个请求方（resortUid）的平均被接受次数（>1 表示同请求被多个代打方接受）
domains:
  - 自定义
computation:
  sql: CAST(COUNT(*) AS DOUBLE) / NULLIF(COUNT(DISTINCT GET_JSON_OBJECT(params, '$.resortUid')), 0)
  metadata:
    aggregation: ""
    field: ""
    source: game.resort.accept
    time_grain: ""
relations:
  - type: derived_from
    target: game.resort.accept
    description: 机械提取自 game.resort.accept 的 metrics 块（key=resort_accept_accepts_per_request）
