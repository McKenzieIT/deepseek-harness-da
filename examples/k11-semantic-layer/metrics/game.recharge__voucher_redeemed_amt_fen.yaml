kind: metric
name: game.recharge__voucher_redeemed_amt_fen
description: 现金券(moneyType=2)充值金额合计(单位分,除以100转元);不计入营收，反映代金券消耗规模而非现金流水
domains:
  - 付费经济
computation:
  sql: SUM(CASE WHEN CAST(GET_JSON_OBJECT(params, '$.moneyType') AS BIGINT) = 2 THEN CAST(GET_JSON_OBJECT(params, '$.money') AS BIGINT) ELSE 0 END)
  metadata:
    aggregation: sum
    field: CASE WHEN CAST(GET_JSON_OBJECT(params, '$.moneyType') AS BIGINT) = 2 THEN CAST(GET_JSON_OBJECT(params, '$.money') AS BIGINT) ELSE 0 END
    source: game.recharge
    time_grain: ""
relations:
  - type: derived_from
    target: game.recharge
    description: 机械提取自 game.recharge 的 metrics 块（key=voucher_redeemed_amt_fen）
