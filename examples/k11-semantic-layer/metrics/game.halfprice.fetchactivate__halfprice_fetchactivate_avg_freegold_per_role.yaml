kind: metric
name: game.halfprice.fetchactivate__halfprice_fetchactivate_avg_freegold_per_role
description: 人均免费钻石发放量（freegold_sum / role_uv，用 NULLIF 防空除）
domains:
  - 付费经济
computation:
  sql: ROUND(SUM(CAST(GET_JSON_OBJECT(params, '$.coinList.freegold') AS BIGINT)) * 1.0 / NULLIF(COUNT(DISTINCT role_id), 0), 4)
  metadata:
    aggregation: ""
    field: ""
    source: game.halfprice.fetchactivate
    time_grain: ""
relations:
  - type: derived_from
    target: game.halfprice.fetchactivate
    description: 机械提取自 game.halfprice.fetchactivate 的 metrics 块（key=halfprice_fetchactivate_avg_freegold_per_role）
