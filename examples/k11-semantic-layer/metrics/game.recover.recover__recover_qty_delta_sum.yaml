kind: metric
name: game.recover.recover__recover_qty_delta_sum
description: 单日恢复总量（newNum - oldNum 求和，恢复事件该差值恒非负，反映资源净增量）
domains:
  - 资源产销
computation:
  sql: SUM(CAST(GET_JSON_OBJECT(params, '$.newNum') AS BIGINT) - CAST(GET_JSON_OBJECT(params, '$.oldNum') AS BIGINT))
  metadata:
    aggregation: sum
    field: CAST(GET_JSON_OBJECT(params, '$.newNum') AS BIGINT) - CAST(GET_JSON_OBJECT(params, '$.oldNum') AS BIGINT)
    source: game.recover.recover
    time_grain: ""
relations:
  - type: derived_from
    target: game.recover.recover
    description: 机械提取自 game.recover.recover 的 metrics 块（key=recover_qty_delta_sum）
