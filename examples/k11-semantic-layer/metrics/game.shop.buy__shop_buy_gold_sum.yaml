kind: metric
name: game.shop.buy__shop_buy_gold_sum
description: 商店购买事件中充值钻石金额合计（coinList.gold 快照求和，非真实付费流水）
domains:
  - 付费经济
computation:
  sql: SUM(CAST(GET_JSON_OBJECT(params,'$.coinList.gold') AS BIGINT))
  metadata:
    aggregation: sum
    field: CAST(GET_JSON_OBJECT(params,'$.coinList.gold') AS BIGINT)
    source: game.shop.buy
    time_grain: ""
relations:
  - type: derived_from
    target: game.shop.buy
    description: 机械提取自 game.shop.buy 的 metrics 块（key=shop_buy_gold_sum）
