kind: metric
name: dws_10000251_univ_dev_act_di__pay_rate
description: 付费率=当日付费设备数/当日活跃设备数(本表为日增量,每行均为活跃设备),以 pay_amt>0 计付费
domains:
  - 用户生命周期
  - 付费经济
  - 角色成长
computation:
  sql: AVG(CASE WHEN pay_amt > 0 THEN 1 ELSE 0 END)
  metadata:
    aggregation: avg
    field: CASE WHEN pay_amt > 0 THEN 1 ELSE 0 END
    source: dws_10000251_univ_dev_act_di
    time_grain: ""
relations:
  - type: derived_from
    target: dws_10000251_univ_dev_act_di
    description: 机械提取自 dws_10000251_univ_dev_act_di 的 metrics 块（key=pay_rate）
