kind: metric
name: dws_10000251_univ_dev_server_whole_df__pay_to_active_ratio
description: 付费设备占活跃设备(act_tm_fst 非空)的比例，即严格意义的付费率(付费/活跃)。付费判定用 pay_amt_std>0；与 pay_rate(付费/快照设备)在存在"付费无活跃"异常设备时会有差异，本指标更符合常规付费转化率口径。
domains:
  - 付费经济
  - 用户生命周期
computation:
  sql: COUNT(DISTINCT CASE WHEN pay_amt_std > 0 THEN user_id END)*1.0/NULLIF(COUNT(DISTINCT CASE WHEN act_tm_fst IS NOT NULL THEN user_id END),0)
  metadata:
    aggregation: count_distinct
    field: CASE WHEN pay_amt_std > 0 THEN user_id END)*1.0/NULLIF(COUNT(DISTINCT CASE WHEN act_tm_fst IS NOT NULL THEN user_id END),0
    source: dws_10000251_univ_dev_server_whole_df
    time_grain: ""
relations:
  - type: derived_from
    target: dws_10000251_univ_dev_server_whole_df
    description: 机械提取自 dws_10000251_univ_dev_server_whole_df 的 metrics 块（key=pay_to_active_ratio）
