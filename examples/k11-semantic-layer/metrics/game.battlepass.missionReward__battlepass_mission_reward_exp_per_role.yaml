  metadata:
    aggregation: sum
    field: CAST(GET_JSON_OBJECT(params, '$.battlePassExp') AS BIGINT)) / NULLIF(COUNT(DISTINCT role_id), 0
    source: game.battlepass.missionReward
    time_grain: ""
relations:
