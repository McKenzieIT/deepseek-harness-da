kind: metric
name: game.recharge__total_revenue_fen
description: 真实营收(单位分,除以100转元);用户2026-07-22确认**仅 moneyType=1(付费购买)计入营收**，moneyType=2(现金券)是消费已持有的代金券非新增现金，不计入
domains:
  - 付费经济
computation:
  sql: SUM(CASE WHEN CAST(GET_JSON_OBJECT(params, '$.moneyType') AS BIGINT) = 1 THEN CAST(GET_JSON_OBJECT(params, '$.money') AS BIGINT) ELSE 0 END)
  metadata:
    aggregation: sum
    field: CASE WHEN CAST(GET_JSON_OBJECT(params, '$.moneyType') AS BIGINT) = 1 THEN CAST(GET_JSON_OBJECT(params, '$.money') AS BIGINT) ELSE 0 END
    source: game.recharge
    time_grain: ""
relations:
  - type: derived_from
    target: game.recharge
    description: 机械提取自 game.recharge 的 metrics 块（key=total_revenue_fen）
