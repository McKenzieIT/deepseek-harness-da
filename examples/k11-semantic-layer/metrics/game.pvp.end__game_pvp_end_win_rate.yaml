kind: metric
name: game.pvp.end__game_pvp_end_win_rate
description: PVP胜率(己方积分>对手积分判定胜),用NULLIF防0除
domains:
  - 战斗关卡
computation:
  sql: SUM(CASE WHEN CAST(GET_JSON_OBJECT(params, '$.score') AS BIGINT) > CAST(GET_JSON_OBJECT(params, '$.relScore') AS BIGINT) THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0)
  metadata:
    aggregation: sum
    field: CASE WHEN CAST(GET_JSON_OBJECT(params, '$.score') AS BIGINT) > CAST(GET_JSON_OBJECT(params, '$.relScore') AS BIGINT) THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0
    source: game.pvp.end
    time_grain: ""
relations:
