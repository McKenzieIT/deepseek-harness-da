kind: metric
name: game.item.use__game_item_use_per_role_avg_num
description: 人均道具消耗数量（消耗总数量 / 去重角色数，NULLIF 防零除）
domains:
  - 装备道具
computation:
  sql: ROUND(CAST(SUM(CASE WHEN GET_JSON_OBJECT(params, '$.itemNum') IS NOT NULL THEN CAST(GET_JSON_OBJECT(params, '$.itemNum') AS BIGINT) ELSE 0 END) AS DOUBLE) / NULLIF(COUNT(DISTINCT role_id), 0), 3)
  metadata:
    aggregation: ""
    field: ""
    source: game.item.use
    time_grain: ""
relations:
  - type: derived_from
    target: game.item.use
    description: 机械提取自 game.item.use 的 metrics 块（key=game_item_use_per_role_avg_num）
