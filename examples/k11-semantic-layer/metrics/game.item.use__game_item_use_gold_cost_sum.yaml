kind: metric
name: game.item.use__game_item_use_gold_cost_sum
description: 单日道具使用伴随的充值钻石(gold)变动累计（来自 coinList.gold，反映付费货币消耗）
domains:
  - 装备道具
computation:
  sql: SUM(CASE WHEN GET_JSON_OBJECT(params, '$.coinList.gold') IS NOT NULL THEN CAST(GET_JSON_OBJECT(params, '$.coinList.gold') AS BIGINT) ELSE 0 END)
  metadata:
    aggregation: sum
    field: CASE WHEN GET_JSON_OBJECT(params, '$.coinList.gold') IS NOT NULL THEN CAST(GET_JSON_OBJECT(params, '$.coinList.gold') AS BIGINT) ELSE 0 END
    source: game.item.use
    time_grain: ""
relations:
  - type: derived_from
    target: game.item.use
    description: 机械提取自 game.item.use 的 metrics 块（key=game_item_use_gold_cost_sum）
