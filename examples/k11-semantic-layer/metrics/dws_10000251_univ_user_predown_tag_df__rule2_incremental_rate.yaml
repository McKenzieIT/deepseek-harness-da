kind: metric
name: dws_10000251_univ_user_predown_tag_df__rule2_incremental_rate
description: 扩展规则相对原生规则的增量捕获率（在原生未覆盖人群 rule1=0 中，扩展规则额外捕获 rule2=1 的占比），分母为原生未覆盖人群数，用 NULLIF 防除零
domains:
  - 用户生命周期
  - 资源产销
computation:
  sql: SUM(CASE WHEN rule1 = 0 AND rule2 = 1 THEN 1 ELSE 0 END) * 1.0 / NULLIF(SUM(CASE WHEN rule1 = 0 THEN 1 ELSE 0 END), 0)
  metadata:
    aggregation: sum
    field: CASE WHEN rule1 = 0 AND rule2 = 1 THEN 1 ELSE 0 END) * 1.0 / NULLIF(SUM(CASE WHEN rule1 = 0 THEN 1 ELSE 0 END), 0
    source: dws_10000251_univ_user_predown_tag_df
    time_grain: ""
relations:
