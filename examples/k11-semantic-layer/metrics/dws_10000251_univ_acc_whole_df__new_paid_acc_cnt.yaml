kind: metric
name: dws_10000251_univ_acc_whole_df__new_paid_acc_cnt
description: 新增付费账号数(pay_tm_fst 落在 ds 当日的账号,即当日首充账号数;需叠加 pay_amt_std>0 排除 epoch 哨兵行,ds 用 TO_DATE 转换)
domains:
  - 用户生命周期
  - 付费经济
computation:
  sql: COUNT(DISTINCT CASE WHEN pay_tm_fst IS NOT NULL AND pay_amt_std > 0 AND DATEDIFF(pay_tm_fst, TO_DATE(ds,'yyyyMMdd'), 'dd')=0 THEN user_id END)
  metadata:
    aggregation: count_distinct
    field: CASE WHEN pay_tm_fst IS NOT NULL AND pay_amt_std > 0 AND DATEDIFF(pay_tm_fst, TO_DATE(ds,'yyyyMMdd'), 'dd')=0 THEN user_id END
    source: dws_10000251_univ_acc_whole_df
    time_grain: ""
relations:
  - type: derived_from
    target: dws_10000251_univ_acc_whole_df
    description: 机械提取自 dws_10000251_univ_acc_whole_df 的 metrics 块（key=new_paid_acc_cnt）
