kind: metric
name: dws_10000251_univ_dev_server_act_di__active_rate
description: 活跃率,对 act(0/1)求均值即活跃行占比;若本表仅含活跃行(act 恒为 1)则恒为 1,此时无业务意义
domains:
  - 用户生命周期
  - 系统监控
computation:
  sql: AVG(act)
  metadata:
    aggregation: avg
    field: act
    source: dws_10000251_univ_dev_server_act_di
    time_grain: ""
relations:
  - type: derived_from
    target: dws_10000251_univ_dev_server_act_di
    description: 机械提取自 dws_10000251_univ_dev_server_act_di 的 metrics 块（key=active_rate）
