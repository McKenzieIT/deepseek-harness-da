kind: metric
name: game.charmStone.refinement__charm_stone_refinement_locked_ratio
description: 对已上锁灵石进行洗练的占比（isLock=true 次数 / 总洗练次数）
domains:
  - 探索收集
computation:
  sql: SUM(CASE WHEN GET_JSON_OBJECT(params, '$.charmStone.isLock') = 'true' THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0)
  metadata:
    aggregation: sum
    field: CASE WHEN GET_JSON_OBJECT(params, '$.charmStone.isLock') = 'true' THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0
    source: game.charmStone.refinement
    time_grain: ""
relations:
  - type: derived_from
    target: game.charmStone.refinement
    description: 机械提取自 game.charmStone.refinement 的 metrics 块（key=charm_stone_refinement_locked_ratio）
