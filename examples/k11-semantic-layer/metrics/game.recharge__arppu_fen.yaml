kind: metric
name: game.recharge__arppu_fen
description: ARPPU(分/真实付费账号,真实营收/moneyType=1且money>0账号去重数;D18已过滤零金额打点噪声;单位分,除以100转元)
domains:
  - 付费经济
computation:
  sql: SUM(CASE WHEN CAST(GET_JSON_OBJECT(params, '$.moneyType') AS BIGINT) = 1 THEN CAST(GET_JSON_OBJECT(params, '$.money') AS BIGINT) ELSE 0 END) / NULLIF(COUNT(DISTINCT CASE WHEN CAST(GET_JSON_OBJECT(params, '$.moneyType') AS BIGINT) = 1 AND CAST(GET_JSON_OBJECT(params, '$.money') AS BIGINT) > 0 THEN account_id END), 0)
  metadata:
    aggregation: sum
    field: CASE WHEN CAST(GET_JSON_OBJECT(params, '$.moneyType') AS BIGINT) = 1 THEN CAST(GET_JSON_OBJECT(params, '$.money') AS BIGINT) ELSE 0 END) / NULLIF(COUNT(DISTINCT CASE WHEN CAST(GET_JSON_OBJECT(params, '$.moneyType') AS BIGINT) = 1 AND CAST(GET_JSON_OBJECT(params, '$.money') AS BIGINT) > 0 THEN account_id END), 0
    source: game.recharge
    time_grain: ""
relations:
  - type: derived_from
    target: game.recharge
    description: 机械提取自 game.recharge 的 metrics 块（key=arppu_fen）
