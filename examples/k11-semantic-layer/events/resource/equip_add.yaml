name: game.equip.add
event_filter: event = 'game.equip.add'
description: '装备道具-装备新获取事件：角色获得一件新装备时上报，含装备uid(euid)、配置id(id)、品质(quality)等装备属性与角色快照(等级/vip/战力/经验)。分析主体为 role_id（角色粒度），account_id 为账号粒度补充。scout 实测 ds=20260729/20260728 均零命中（cnt=0），事件疑似下线或当前版本未触发。原参数说明：游戏服id、游戏服名字、账号id、角色id、角色名、性别、创角时间、上线时间、角色等级、vip等级、角色战力、经验 等25个'
domains:
- 装备道具
domain: resource
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  euid:
    type: int
    description: 装备uid
  id:
    type: int
    description: 装备配置id
  quality:
    type: int
    description: 装备品质
metrics:
  equip_add_cnt:
    description: 装备新获取事件总次数
    expression: COUNT(*)
  equip_add_role_uv:
    description: 获取装备的去重角色数（分析主体粒度）
    expression: COUNT(DISTINCT role_id)
  equip_add_account_uv:
    description: 获取装备的去重账号数
    expression: COUNT(DISTINCT account_id)
  equip_add_server_uv:
    description: 产生装备获取行为的去重游戏服数
    expression: COUNT(DISTINCT server_id)
  equip_add_euid_uv:
    description: 获取装备实例的去重装备uid数（按 euid）
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.euid'))
  equip_add_cfg_id_uv:
    description: 获取装备的去重装备配置id数（按 id）
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.id'))
  equip_add_per_role:
    description: 人均装备获取次数（总次数/去重角色数，分母为0时返回NULL）
    expression: CAST(COUNT(*) AS DOUBLE) / NULLIF(COUNT(DISTINCT role_id), 0)
coverage:
  scenarios:
    - 装备产出与获取节奏（每日新获取装备总量/角色覆盖度/人均次数）
    - 装备配置与品质分布（哪些装备id/品质被获取，支撑掉落与品质漏斗分析）
    - 服务器维度装备获取分布（识别活动/玩法投放效果差异）
  limitations:
    - 'scout 实测 ds=20260729 与 ds=20260728 均零命中（cnt=0/role_uv=0/acc_uv=0），事件疑似下线或当前版本未触发，上述指标实测值均为0'
    - '仅 ds=20260729/ds=20260728 双日 scout 实测，未做全量复核；待事件恢复上报后需复测'
    - '分析主体默认 role_id（角色粒度），账号粒度 account_id 为补充'
coverage_status: draft
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: '2026-07-30'
  note: 'scout 实测 ds=20260729: cnt=0/role_uv=0/acc_uv=0/server_uv=0；retry ds=20260728 仍为0；零命中，事件疑似下线/未触发，保持 draft'
