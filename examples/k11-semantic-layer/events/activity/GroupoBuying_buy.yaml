name: game.GroupoBuying.buy
event_filter: event = 'game.GroupoBuying.buy'
description: '团购玩法购买事件：角色在团购活动中购买商品/档位，记录轮次(roundId)与商品id(id)及购买时的角色、服务器、货币快照。主体粒度 role_id（角色级事件）。ds=20260729/20260728 scout 实测零命中(cnt=0)，事件疑似下线或未触发。'
domains:
- 自定义
domain: activity
metrics:
  game_GroupoBuying_buy_cnt:
    expression: COUNT(*)
    description: 团购购买事件总次数
  game_GroupoBuying_buy_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 触发团购购买的去重角色数
  game_GroupoBuying_buy_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 触发团购购买的去重账号数
  game_GroupoBuying_buy_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 触发团购购买的去重服务器数
coverage:
  scenarios:
  - 用于分析团购玩法的参与规模、角色/账号/服务器覆盖及购买频次。
  limitations:
  - 日志中零命中(ds=20260729/20260728)，疑似下线/未触发
  - 仅 ds=20260729 单日 scout 实测，未做全量复核
  - 默认主体 role_id（角色级事件）
  default_subject: role_id
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  roundId:
    type: int
    description: 轮次
  id:
    type: int
    description: id
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-31
  confirmed_at: "2026-07-31"
  note: "ds=20260729 cnt=0/role_uv=0/acc_uv=0；ds=20260728 cnt=0。日志中零命中，疑似下线/未触发。"
  coverage_status: draft
