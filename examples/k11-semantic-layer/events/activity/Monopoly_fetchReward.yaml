name: game.Monopoly.fetchReward
event_filter: event = 'game.Monopoly.fetchReward'
description: '大富翁(Monopoly)玩法领取奖励事件。记录角色在大富翁玩法中领取奖励(含排行榜总计奖励)的行为，携带角色、服务器、VIP、货币列表及奖励 type/id/allRound 等信息。主体粒度为 role_id（角色级）。ds=20260729 单日 scout 实测零命中。'
domains:
- 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  type:
    type: int
    description: type
  id:
    type: int
    description: id
  allRound:
    type: int
    description: 如果是领取排行榜总计奖励
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-31
  confirmed_at: '2026-07-31'
  note: 'ds=20260729 cnt=0/role_uv=0/acc_uv=0；ds=20260728 cnt=0/role_uv=0/acc_uv=0。日志零命中。'
  coverage_status: draft

metrics:
  game_Monopoly_fetchReward_cnt:
    expression: COUNT(*)
    description: 大富翁玩法领奖事件总次数（按角色级行计）
  game_Monopoly_fetchReward_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 大富翁玩法领奖事件去重角色数
  game_Monopoly_fetchReward_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 大富翁玩法领奖事件去重账号数
  game_Monopoly_fetchReward_allround_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params,'$.allRound') AS BIGINT))
    description: 大富翁玩法领取排行榜总计奖励累计量

coverage:
  scenarios:
  - 大富翁玩法领奖事件的发生次数、参与角色/账号数、以及排行榜总计奖励(allRound)的累计领取量
  limitations:
  - 仅 ds=20260729 单日 scout 实测，未做全量复核
  - 日志中零命中(ds=20260729/20260728 cnt=0)，疑似下线/未触发
  - 主体粒度默认 role_id（角色），账号级口径需用 account_uv 单独核算
