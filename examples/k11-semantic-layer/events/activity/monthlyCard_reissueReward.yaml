name: game.monthlyCard.reissueReward
event_filter: event = 'game.monthlyCard.reissueReward'
description: '月卡补发奖励事件：玩家月卡奖励因补发触发下发的记录，用于追踪月卡补发的发生量、覆盖角色与账号规模及涉及的游戏服分布。参数含游戏服id/名字、账号id、角色id/名字/性别/创角时间/上线时间/等级/vip/战力/经验、关键货币列表(充值钻石/赠送钻石/免费钻石/紫金/经验卷轴/体力)、会话id、logUUID、月卡id与时间共24个。主体粒度为 role_id。'
domains:
- 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  id:
    type: int
    description: 月卡id
  time:
    type: int
    description: 时间
metrics:
  game_monthlyCard_reissueReward_cnt:
    expression: COUNT(*)
    description: 月卡补发奖励事件总记录数（按事件行计）
  game_monthlyCard_reissueReward_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 月卡补发奖励覆盖的去重角色数
  game_monthlyCard_reissueReward_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 月卡补发奖励覆盖的去重账号数
  game_monthlyCard_reissueReward_card_uv:
    expression: COUNT(DISTINCT CAST(GET_JSON_OBJECT(params,'$.id') AS BIGINT))
    description: 月卡补发涉及的去重月卡id数（月卡类型维度）
coverage:
  scenarios:
  - 上述指标用于回答“月卡补发奖励发生了多少次、覆盖多少角色/账号、涉及多少种月卡id”，衡量月卡补发机制的实际触发规模与受众面。
  limitations:
  - 仅 ds=20260729 单日 scout 实测，未做全量复核；默认主体为 role_id；月卡id取自 params.id 字段，可能存在非预期空值。
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-31
  confirmed_at: "2026-07-31"
  note: 'ds=20260729 scout 实测：cnt=161, role_uv=100, acc_uv=99, server_uv=58；数字合理，判定为真实触发事件。'
  coverage_status: analyst_confirmed
