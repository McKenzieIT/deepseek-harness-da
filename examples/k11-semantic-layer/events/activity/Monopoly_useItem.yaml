name: game.Monopoly.useItem
event_filter: event = 'game.Monopoly.useItem'
description: '大富翁(Monopoly)活动中角色使用道具事件：记录角色在 Monopoly 玩法中消耗/使用道具的次数与对象。参数含游戏服id、角色id/名、等级、vip、战力、经验、货币列表(钻石/紫金/体力等)、道具id、value、stepNum。主体粒度为 role_id，度量道具使用行为量与角色覆盖。'
domains:
- 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  id:
    type: int
    description: id
  value:
    type: int
    description: value
  stepNum:
    type: int
    description: stepNum
metrics:
  game_Monopoly_useItem_cnt:
    expression: COUNT(*)
    description: Monopoly 道具使用事件总次数
  game_Monopoly_useItem_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 使用过 Monopoly 道具的去重角色数
  game_Monopoly_useItem_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 使用过 Monopoly 道具的去重账号数
  game_Monopoly_useItem_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 触发 Monopoly 道具使用的去重游戏服数
coverage:
  scenarios:
  - 统计 Monopoly 活动道具使用频次与角色/账号/游戏服覆盖
  - 作为道具消耗、玩法活跃度与资源产销分析的基础计数
  limitations:
  - 仅 ds=20260729 单日 scout 实测，未做全量复核
  - 日志中零命中(ds=20260729 cnt=0/role_uv=0/acc_uv=0；ds=20260728 仍为 0)，疑似事件下线/未触发或日志未上报
  - 主体粒度默认 role_id；零命中下指标数值预期为 0
  default_subject: role_id
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-31
  confirmed_at: "2026-07-31"
  note: 'scout 实测 ds=20260729: cnt=0, role_uv=0, acc_uv=0, server_uv=0；ds=20260728 复测同为零。事件疑似下线/未触发，维持 draft。'
  coverage_status: draft
