name: game.Monopoly.performBattle
event_filter: event = 'game.Monopoly.performBattle'
description: 'Monopoly 大富翁玩法战斗结算事件，记录角色在 Monopoly 棋盘战斗中的通关/挑战行为，含角色等级、战力、vip等级及战斗时点携带的关键货币（钻石/紫金/体力等）。主体粒度为 role_id（角色），实测单日(ds=20260729/20260728)零命中。'
metrics:
  game_monopoly_performbattle_cnt:
    expression: COUNT(*)
    description: Monopoly 战斗事件总条数（次数）
  game_monopoly_performbattle_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: Monopoly 战斗触发角色数（去重）
  game_monopoly_performbattle_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: Monopoly 战斗触发账号数（去重）
  game_monopoly_performbattle_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: Monopoly 战斗触发游戏服数（去重）
coverage:
  scenarios:
  - 衡量大富翁玩法的战斗活跃度（次数/角色UV/账号UV/服务器覆盖）
  - 作为战斗关卡域下 Monopoly 子玩法的活跃与渗透指标
  limitations:
  - 仅 ds=20260729 单日 scout 实测，未做全量复核
  - 日志中零命中(ds=20260729/20260728 cnt=0)，疑似事件下线/未触发或埋点未上线
  - 默认主体粒度为 role_id（角色）
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-31
  confirmed_at: '2026-07-31'
  coverage_status: draft
  note: 'scout: ds=20260729 cnt=0 role_uv=0 acc_uv=0 server_uv=0；retry ds=20260728 仍 0；零命中，疑似下线/未触发'
domains:
- 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  type:
    type: int
    description: type
  chapterId:
    type: int
    description: chapterId
  id:
    type: int
    description: id
