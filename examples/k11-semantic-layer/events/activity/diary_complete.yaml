name: game.diary.complete
event_filter: event = 'game.diary.complete'
description: "日记完成事件。记录角色完成一条日记条目（params.id 为日记id），附带角色等级、vip、战力、关键货币 coinList（充值钻石/紫金/体力等）等 23 个参数。分析主体为 role_id（角色粒度），account_id 为账号粒度补充。ds=20260729 实测：cnt=3002, role_uv=906, acc_uv=893, server_uv=59。"
domains:
- 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  id:
    type: int
    description: 日记id
metrics:
  game_diary_complete_cnt:
    expression: COUNT(*)
    description: 日记完成事件总记录数（每条=一次日记条目完成）
  game_diary_complete_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 完成日记的去重角色数
  game_diary_complete_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 完成日记的去重账号数
  game_diary_complete_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 涉及的去重游戏服数量
coverage:
  scenarios:
    - 日记完成参与度与活跃度（cnt / role_uv / account_uv）
    - 日记玩法跨服分布与覆盖服数（server_uv）
  limitations:
    - "仅 ds=20260729 单日 scout 实测，未做全量复核"
    - 分析主体默认 role_id（角色粒度）；account_id 可作账号粒度补充
    - 日记 id 取值唯一性未抽样核对，未做跨日复核
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-31
  confirmed_at: "2026-07-31"
  note: "实测 ds=20260729：cnt=3002, role_uv=906, acc_uv=893, server_uv=59。事件+ds 过滤命中且数值合理。"
coverage_status: analyst_confirmed
