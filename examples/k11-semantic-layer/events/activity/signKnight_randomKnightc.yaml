name: game.signKnight.randomKnightc
event_filter: event = 'game.signKnight.randomKnightc'
description: '全武将活动-随机武将卡池刷新事件。玩家在全武将(signKnight)活动中触发随机武将刷新，记录当时刷新出的武将配置id(cachedKnights)与玩家货币快照(coinList)。分析主体为 role_id（角色粒度），ds=20260729 scout 实测：cnt=1261，role_uv=1216，acc_uv=1187，server_uv=194。参数含游戏服id/名字、账号id、角色id/名/性别/创角时间/上线时间/等级/vip等级/战力/经验、看板娘、关键货币(gold/sendgold/freegold/diamond/expCoin/energy)、sessionId、logUUID、配置id、缓存武将列表等24个字段。'
domains:
- 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  id:
    type: int
    description: 配置id
  cachedKnights:
    type: array
    description: 缓存武将id
metrics:
  signKnight_randomKnightc_cnt:
    description: 随机武将刷新事件总次数
    expression: COUNT(*)
  signKnight_randomKnightc_role_uv:
    description: 触发随机武将刷新的去重角色数
    expression: COUNT(DISTINCT role_id)
  signKnight_randomKnightc_account_uv:
    description: 触发随机武将刷新的去重账号数
    expression: COUNT(DISTINCT account_id)
  signKnight_randomKnightc_server_uv:
    description: 触发随机武将刷新的去重游戏服数
    expression: COUNT(DISTINCT server_id)
  signKnight_randomKnightc_config_uv:
    description: 随机刷新涉及的去重武将配置id数
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.id'))
coverage:
  scenarios:
  - 全武将活动随机武将卡池的参与角色规模与活跃度
  - 各游戏服随机刷新触发分布，识别高活跃服
  - 随机刷新出的武将配置id覆盖广度
  limitations:
  - 仅 ds=20260729 单日 scout 实测，未做全量复核
  - 分析主体默认 role_id（角色粒度），未做 account 维度交叉复核
  - cachedKnights 为数组字段，未在本次 metrics 中展开聚合
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: '2026-07-30'
  note: 'ds=20260729 scout 实测：cnt=1261，role_uv=1216，acc_uv=1187，server_uv=194，数字合理（角色级刷新事件，单日 1261 次触发覆盖 1216 角色）'
coverage_status: analyst_confirmed
