name: game.script.storytrade
event_filter: event = 'game.script.storytrade'
description: '剧本委托（game.script.storytrade）：记录玩家在剧本系统中触发委托任务的日志。参数含游戏服、账号、角色、性别、创角/上线时间、角色等级、vip等级、角色战力、经验、看板娘、关键货币列表（充值钻石/赠送钻石/免费钻石/紫金/经验卷轴/体力）及委托id。分析主体为 role_id（角色粒度），account_id 可作为账号粒度补充。scout 实测 ds=20260729：cnt=4701，role_uv=1165，acc_uv=1144，server_uv=370。'
domains:
- 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  id:
    type: int
    description: 委托id
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: 'scout 实测 ds=20260729：cnt=4701, role_uv=1165, acc_uv=1144, server_uv=370，命中合理，事件在线活跃。'
metrics:
  game_script_storytrade_cnt:
    expression: COUNT(*)
    description: 剧本委托事件总记录数
  game_script_storytrade_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 触发委托的 distinct 角色数
  game_script_storytrade_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 触发委托的 distinct 账号数
  game_script_storytrade_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 触发委托的 distinct 游戏服数
  game_script_storytrade_commission_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.id'))
    description: 触发的 distinct 委托id数（去重 GET_JSON_OBJECT(params,'$.id')）
  game_script_storytrade_avg_role_level:
    expression: AVG(CAST(GET_JSON_OBJECT(params, '$.roleLevel') AS BIGINT))
    description: 触发委托角色的平均角色等级
  game_script_storytrade_avg_vip_level:
    expression: AVG(CAST(GET_JSON_OBJECT(params, '$.vipLevel') AS BIGINT))
    description: 触发委托角色的平均 vip 等级
coverage:
  scenarios:
    - 评估剧本委托系统的角色/账号参与广度（role_uv / account_uv / server_uv）
    - 衡量委托触发规模与热门委托id分布（cnt / commission_uv）
    - 刻画委托参与玩家的角色等级与vip等级画像（avg_role_level / avg_vip_level）
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核（多日趋势未验证）
    - 分析主体默认 role_id（角色粒度），account_id 仅为账号粒度补充
    - coinList 为货币余额快照，非流水金额，未纳入 SUM 指标以避免误读
    - 未验证 roleLevel/vipLevel 字段是否存在空值或异常大值，AVG 可能受异常点影响
coverage_status: analyst_confirmed
