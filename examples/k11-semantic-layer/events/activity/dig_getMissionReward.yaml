name: game.dig.getMissionReward
event_filter: event = 'game.dig.getMissionReward'
description: '挖宝领取任务奖励事件：玩家在挖宝玩法中领取任务奖励时触发，记录角色维度（roleId/roleName/roleLevel/vipLevel/roleForce/exp）及奖励任务ID（params.id）。主体粒度为 role_id（单角色单次领取行为），真实计量为单日领取次数与去重角色/账号/服务器数。'

domains:
- 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  id:
    type: int
    description: 任务ID
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-31
  confirmed_at: "2026-07-31"
  note: "ds=20260729 cnt=0 role_uv=0 acc_uv=0 server_uv=0；ds=20260728 重试 cnt=0。日志中零命中，疑似下线/未触发。"
  coverage_status: draft
metrics:
  game_dig_getMissionReward_cnt:
    description: 挖宝领取任务奖励总次数
    expression: COUNT(*)
  game_dig_getMissionReward_role_uv:
    description: 领取任务奖励的去重角色数
    expression: COUNT(DISTINCT role_id)
  game_dig_getMissionReward_account_uv:
    description: 领取任务奖励的去重账号数
    expression: COUNT(DISTINCT account_id)
  game_dig_getMissionReward_server_uv:
    description: 领取任务奖励的去重游戏服数
    expression: COUNT(DISTINCT server_id)
coverage:
  scenarios:
  - 挖宝玩法任务奖励领取的总量与去重角色/账号/服务器分布
  - 评估挖宝任务参与广度（server_uv）与角色参与深度（role_uv）
  limitations:
  - 仅 ds=20260729 单日 scout 实测，未做全量复核
  - 日志中零命中(ds=20260729/20260728)，疑似下线/未触发
  - 默认主体粒度为 role_id（角色维度事件）
