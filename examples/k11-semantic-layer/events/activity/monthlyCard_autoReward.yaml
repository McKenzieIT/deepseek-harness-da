name: game.monthlyCard.autoReward
event_filter: event = 'game.monthlyCard.autoReward'
description: 月卡自动发奖事件：月卡到点系统自动派发奖励时触发，记录发奖的月卡id、发奖次数与剩余持续时间。按角色(role_id)粒度记录。scout实测 ds=20260729/20260728 均为 0 命中。
domains:
- 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  id:
    type: int
    description: 月卡id
  count:
    type: int
    description: count
  lastingDays:
    type: int
    description: 持续时间
metrics:
  game_monthlyCard_autoReward_cnt:
    expression: COUNT(*)
    description: 月卡自动发奖事件总次数
  game_monthlyCard_autoReward_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 触发月卡自动发奖的去重角色数
  game_monthlyCard_autoReward_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 触发月卡自动发奖的去重账号数
  game_monthlyCard_autoReward_count_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params,'$.count') AS BIGINT))
    description: 月卡自动发奖的累计发奖次数(params.count 求和)
coverage:
  scenarios:
    - 月卡自动发奖的频次、覆盖角色/账号数、各服务器发奖分布；count_sum 反映发奖总次数。
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 日志中零命中(ds=20260729/20260728)，疑似下线/未触发
    - 默认 subject 为 role_id
  coverage_status: draft
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-31
  confirmed_at: '2026-07-31'
  note: scout ds=20260729 cnt=0/role_uv=0/acc_uv=0/server_uv=0；ds=20260728 同样 0 命中。零命中，保持 draft。
