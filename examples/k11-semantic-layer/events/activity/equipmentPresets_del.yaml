name: game.equipmentPresets.del
event_filter: event = 'game.equipmentPresets.del'
description: '装备预设删除事件：玩家删除已保存的装备预设方案。记录删除时的角色、账号、服务器及预设id等信息，主体粒度为 role_id。ds=20260729 实测单日 cnt=25、role_uv=13、acc_uv=12。'
domains:
- 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  id:
    type: int
    description: 预设id
metrics:
  game_equipmentPresets_del_cnt:
    expression: COUNT(*)
    description: 装备预设删除事件总次数
  game_equipmentPresets_del_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 删除装备预设的去重角色数（主体粒度）
  game_equipmentPresets_del_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 删除装备预设的去重账号数
  game_equipmentPresets_del_preset_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params,'$.id'))
    description: 被删除的去重装备预设id数
coverage:
  scenarios:
    - 衡量装备预设方案删除的总体规模、参与角色/账号广度及被删预设id分布，用于装备预设系统使用与流失分析。
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 主体粒度为 role_id
    - preset_uv 依赖 params 中 id 字段完整性
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-31
  confirmed_at: '2026-07-31'
  note: ds=20260729 实测 cnt=25、role_uv=13、acc_uv=12、server_uv=10，数据合理。
  coverage_status: analyst_confirmed
