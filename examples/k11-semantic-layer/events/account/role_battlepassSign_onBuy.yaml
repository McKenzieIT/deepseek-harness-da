name: game.role.battlepassSign.onBuy
event_filter: event = 'game.role.battlepassSign.onBuy'
description: '三日奖励（battlepass签到）购买事件：玩家购买三日奖励/battlepass签到礼包时上报，记录购买行为及角色与货币快照（id 标识购买的奖励档位，实测如 10075/10076/10077）。分析主体为 role_id（角色粒度）。ds=20260729 单日 scout 实测 cnt=89, role_uv=75, acc_uv=74, server_uv=8, 共 3 个奖励档位。'
domains:
- 用户生命周期
- 付费经济
domain: account
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  id:
    type: int
    description: id
metrics:
  role_battlepassSign_onBuy_cnt:
    expression: COUNT(*)
    description: 三日奖励购买事件总记录数（购买次数）
  role_battlepassSign_onBuy_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 购买三日奖励的去重角色数
  role_battlepassSign_onBuy_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 购买三日奖励的去重账号数
  role_battlepassSign_onBuy_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 购买三日奖励覆盖的去重游戏服数
  role_battlepassSign_onBuy_sign_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params,'$.id'))
    description: 购买三日奖励涉及的奖励档位去重数（id 字段标识档位）
coverage:
  scenarios:
  - 三日奖励/签到礼包购买参与度：通过 cnt/role_uv 衡量每日购买该礼包的角色规模与频次
  - 付费转化与档位偏好：通过 sign_uv 与各 id 档位分布了解玩家对 10075/10076/10077 等不同奖励档位的选择偏好
  - 服务器分布：server_uv 反映购买行为覆盖的游戏服范围
  limitations:
  - 仅 ds=20260729 单日 scout 实测，未做全量复核
  - 分析主体默认 role_id（角色粒度）；event 名为 game.role.* 即角色级事件
  - params 无 money/price/amount 字段，无法直接核算真实付费金额；coinList 为货币余额快照而非本次消费额
  - id 字段经实测为奖励档位标识（如 10075/10076/10077），非流水号
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: '2026-07-30'
  note: 'scout 实测 ds=20260729: cnt=89, role_uv=75, acc_uv=74, server_uv=8; 3 个奖励档位(id=10075/10076/10077, 分别 63/20/6 笔)。数据量级合理。'
coverage_status: analyst_confirmed
