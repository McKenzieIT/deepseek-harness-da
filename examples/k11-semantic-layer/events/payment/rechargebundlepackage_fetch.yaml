name: game.rechargebundlepackage.fetch
event_filter: event = 'game.rechargebundlepackage.fetch'
description: '136礼包-领取奖励：玩家领取136元充值档位礼包后触发的领奖埋点，记录领取瞬间各类货币的产出/变动（充值钻石、赠送钻石、免费钻石、紫金、经验卷轴、体力等）。主体粒度为 role_id，可用于统计该档位礼包的领取活跃度与货币产出量。

  参数：游戏服id、游戏服名字、账号id、角色id、角色名、性别、创角时间、上线时间、角色等级、vip等级、角色战力、经验 等23个'
domains:
- 付费经济
domain: payment
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  id:
    type: int
    description: id
metrics:
  rechargebundlepackage_fetch_cnt:
    expression: COUNT(*)
    description: 136礼包领取事件总次数(每条日志=一次136元礼包领取)
  rechargebundlepackage_fetch_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 领取136礼包的去重角色数(去重基础视图 role_id,即 params.roleId)
  rechargebundlepackage_fetch_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 领取136礼包的去重账号数(去重基础视图 account_id,即 params.accountId)
  rechargebundlepackage_fetch_server_dn:
    expression: COUNT(DISTINCT server_id)
    description: 触发领取的去重游戏服数
  rechargebundlepackage_fetch_gold_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.coinList.gold') AS BIGINT))
    description: 136礼包产出的充值钻石总量(coinList.gold 求和)
  rechargebundlepackage_fetch_sendgold_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.coinList.sendgold') AS BIGINT))
    description: 136礼包产出的充值赠送钻石总量(coinList.sendgold 求和)
  rechargebundlepackage_fetch_freegold_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.coinList.freegold') AS BIGINT))
    description: 136礼包产出的免费钻石总量(coinList.freegold 求和)
  rechargebundlepackage_fetch_avg_cnt_per_role:
    expression: CAST(COUNT(*) AS DOUBLE) / NULLIF(COUNT(DISTINCT role_id), 0)
    description: 领取角色的平均领取次数(总次数/去重角色数)
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: '2026-07-30'
  note: "实测 ds=20260729：cnt=597, role_uv=197, acc_uv=196, server_uv=35；货币产出 gold_sum=6246/sendgold_sum=7260/freegold_sum=9550566(diamond 全 null)。数字合理，事件在线且正常触发。"
coverage:
  scenarios:
  - 136元礼包领取事件规模与触达角色/账号数(rechargebundlepackage_fetch_cnt/role_uv/account_uv)
  - 礼包对应的充值钻石/赠送钻石/免费钻石产出量(gold_sum/sendgold_sum/freegold_sum)
  - 领取角色平均领取次数(avg_cnt_per_role)与游戏服覆盖数(server_dn)
  limitations:
  - 仅 ds=20260729 单日 scout 实测(cnt=597/role_uv=197/acc_uv=196/server_dn=35/gold_sum=6246/sendgold_sum=7260/freegold_sum=9550566,coinList.diamond 全 null),未做全量多日复核
  - 该事件为领取奖励埋点,本身不直接含金额(元),货币产出以游戏内钻石计;若需元口径金额需关联订单侧充值埋点
  - subject 粒度默认 role_id,未逐事件实测,但 params.roleId/roleName/accountId 均存在且与基础视图 role_id/account_id 同族口径一致
  coverage_status: analyst_confirmed
