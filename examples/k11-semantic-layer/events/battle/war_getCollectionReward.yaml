name: game.war.getCollectionReward
event_filter: event = 'game.war.getCollectionReward'
description: '战役活动收集品领奖：玩家在战役/活动玩法中领取收集品奖励时触发的埋点事件，参数 id 标识所领取的收集品id，coinList 携带领奖前后关键货币快照（充值钻石/赠送钻石/免费钻石/紫金/经验卷轴/体力）。分析主体为 role_id（角色粒度），可按 server_id 拆分游戏服。scout 实测 ds=20260729/20260728 均零命中，疑似该收集品活动已下线或当期未触发。'
domains:
- 战斗关卡
domain: battle
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  id:
    type: int
    description: 收集品id
metrics:
  game_war_getCollectionReward_cnt:
    expression: COUNT(*)
    description: 收集品领奖事件总次数（全量行数）
  game_war_getCollectionReward_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 领取收集品奖励的去重角色数
  game_war_getCollectionReward_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 领取收集品奖励的去重账号数
  game_war_getCollectionReward_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 领取收集品奖励涉及的去重游戏服数
  game_war_getCollectionReward_item_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.id'))
    description: 领取的去重收集品id数（基于 params.id）
  game_war_getCollectionReward_item_cnt:
    expression: 'COUNT(IF(GET_JSON_OBJECT(params, ''$.id'') IS NOT NULL, 1, NULL))'
    description: 收集品id非空的领奖行数（用于按收集品聚合的分子）
coverage:
  scenarios:
  - 战役/活动收集品领奖的参与角色规模、账号覆盖、游戏服分布
  - 不同收集品id的被领奖热度（按 params.id 聚合次数/UV）
  - 按 ds/hh 观察领奖时段分布与活动周期
  limitations:
  - 日志中零命中(ds=20260729/20260728)，疑似下线/未触发，metrics 为结构性定义待日志恢复后回填实测值
  - 仅 ds=20260729/20260728 两个单日 scout 实测，未做全量复核
  - 分析主体默认 role_id（角色粒度），未独立验证
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: 'scout 实测 ds=20260729: cnt=0/role_uv=0/acc_uv=0/server_uv=0；ds=20260728 同样零命中。日志中零命中，疑似该收集品活动已下线或当期未触发，保持 draft。'
coverage_status: draft
