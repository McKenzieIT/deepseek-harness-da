name: game.conquest.getTaskReward
event_filter: event = 'game.conquest.getTaskReward'
description: '讨伐(Conquest)任务奖励领取事件：玩家在讨伐玩法中完成指定任务后领取奖励(充值钻石/紫金/体力/经验等)上报。分析粒度为角色(role_id)，每个角色每次领奖产生一条日志，params.id 为奖励配置id。scout 实测 ds=20260729/20260728 均零命中，事件疑似下线或未触发。'
domains:
- 战斗关卡
domain: battle
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  id:
    type: int
    description: 奖励id
metrics:
  game_conquest_getTaskReward_cnt:
    expression: COUNT(*)
    description: 讨伐任务奖励领取事件总条数
  game_conquest_getTaskReward_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 去重领奖角色数
  game_conquest_getTaskReward_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 去重领奖账号数
  game_conquest_getTaskReward_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 去重涉及游戏服数
  game_conquest_getTaskReward_gold_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.coinList.gold') AS BIGINT))
    description: 奖励发放充值钻石总量
  game_conquest_getTaskReward_energy_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.coinList.energy') AS BIGINT))
    description: 奖励发放体力总量
  game_conquest_getTaskReward_exp_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.exp') AS BIGINT))
    description: 奖励发放经验总量
coverage:
  scenarios:
  - 讨伐任务奖励发放量、参与角色数与游戏服覆盖度（活跃度与渗透）
  - 奖励货币/经验/体力总产出（经济产出与单角色价值）
  - 角色级粒度(roleId)的领奖频次与人均货币收益分布
  limitations:
  - 日志中零命中(ds=20260729/20260728)，疑似下线/未触发
  - 仅 ds=20260729/20260728 单日 scout 实测，未做全量复核
  - 分析粒度默认 role_id（事件 params.roleId 为角色id，未独立校验去重语义）
  - 因零命中，奖励货币/经验/体力 SUM 指标本日未验证非零产出
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: 'scout 实测 ds=20260729 与 ds=20260728: cnt=0, role_uv=0, acc_uv=0, server_uv=0；事件零命中，疑似下线/未触发，维持 draft'
coverage_status: draft
