name: game.champion.championReward
event_filter: event = 'game.champion.championReward'
description: '争霸赛(Champion)任务奖励事件：玩家在争霸赛赛季中达成任务/里程碑时领取奖励(充值钻石/紫金/体力/经验等)上报。分析粒度为角色(role_id)，每个角色每次领奖产生一条日志。真实实测 ds=20260729：事件3243条，去重角色1072个，去重账号1057个，覆盖340个游戏服。'
domains:
- 战斗关卡
domain: battle
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  seasonId:
    type: int
    description: seasonId
  uid:
    type: int
    description: uid
  id:
    type: int
    description: id
metrics:
  game_champion_championReward_cnt:
    expression: COUNT(*)
    description: 争霸赛任务奖励事件总条数
  game_champion_championReward_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 去重领奖角色数
  game_champion_championReward_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 去重领奖账号数
  game_champion_championReward_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 去重涉及游戏服数
  game_champion_championReward_gold_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.coinList.gold') AS BIGINT))
    description: 奖励发放充值钻石总量
  game_champion_championReward_energy_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.coinList.energy') AS BIGINT))
    description: 奖励发放体力总量
  game_champion_championReward_exp_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.exp') AS BIGINT))
    description: 奖励发放经验总量
  game_champion_championReward_gold_per_role:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.coinList.gold') AS BIGINT)) / NULLIF(COUNT(DISTINCT role_id), 0)
    description: 人均发放充值钻石量
coverage:
  scenarios:
  - 争霸赛任务奖励发放量、参与角色数与游戏服覆盖度（活跃度与渗透）
  - 奖励货币/经验/体力总产出与人均产出（经济产出与单角色价值）
  - 角色级粒度(roleId)的领奖频次与人均货币收益分布
  limitations:
  - 仅 ds=20260729 单日 scout 实测，未做全量复核
  - 分析粒度默认 role_id（事件 params.roleId 为角色id，未独立校验去重语义）
  - coinList.diamond(紫金) 实测 ds=20260729 SUM 为 NULL，本日未发放紫金，未列入指标
  - coinList.sendgold/freegold/expCoin 本日可能为零或NULL，仅 gold/energy/exp 有非零产出
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: 'scout 实测 ds=20260729: cnt=3243, role_uv=1072, acc_uv=1057, server_uv=340;
    奖励产出 gold_sum=187190, energy_sum=1529913, exp_sum=5389960 (diamond NULL)'
coverage_status: analyst_confirmed
