name: game.war.setQishi
event_filter: event = 'game.war.setQishi'
description: '战役活动设置气势

  参数：游戏服id、游戏服名字、账号id、角色id、角色名、性别、创角时间、上线时间、角色等级、vip等级、角色战力、经验 等23个'
domains:
- 战斗关卡
domain: battle
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  id:
    type: int
    description: 气势id
metrics:
  war_setQishi_cnt:
    description: 战役气势设置事件总次数（去重前原始行数）
    expression: COUNT(*)
  war_setQishi_role_uv:
    description: 触发战役气势设置的去重角色数
    expression: COUNT(DISTINCT role_id)
  war_setQishi_account_uv:
    description: 触发战役气势设置的去重账号数
    expression: COUNT(DISTINCT account_id)
  war_setQishi_server_uv:
    description: 触发战役气势设置的去重游戏服数
    expression: COUNT(DISTINCT server_id)
  war_setQishi_qishi_id_uv:
    description: 配置不同气势 id 的去重角色数（探查气势配置多样性）
    expression: COUNT(DISTINCT CASE WHEN GET_JSON_OBJECT(params,'$.id') IS NOT NULL THEN role_id END)
  war_setQishi_role_force_sum:
    description: 触发事件角色战力累计（参考性求和，未去重）
    expression: SUM(CAST(GET_JSON_OBJECT(params,'$.roleForce') AS BIGINT))
  war_setQishi_role_level_avg:
    description: 触发事件角色平均等级（按行级算术平均，含 NULLIF 兜底）
    expression: SUM(CAST(GET_JSON_OBJECT(params,'$.roleLevel') AS BIGINT)) / NULLIF(COUNT(CAST(GET_JSON_OBJECT(params,'$.roleLevel') AS BIGINT)),0)
  war_setQishi_vip_level_avg:
    description: 触发事件角色平均 VIP 等级
    expression: SUM(CAST(GET_JSON_OBJECT(params,'$.vipLevel') AS BIGINT)) / NULLIF(COUNT(CAST(GET_JSON_OBJECT(params,'$.vipLevel') AS BIGINT)),0)
coverage:
  scenarios:
  - 战役玩法中玩家气势配置的总体触发规模（次数、角色 UV、账号 UV、服务器 UV）
  - 不同气势 id 的配置分布，识别热门/冷门气势
  - 配置气势角色群体的等级、VIP、战力画像（平均值参考）
  limitations:
  - 日志中零命中(ds=20260729/20260728)，疑似下线/未触发，metrics 当前不可计算（值均为 0/NULL）
  - 仅 ds=20260729/20260728 双日 scout 实测，未做全量复核
  - 分析主体默认 role_id（事件 params 含 roleId/accountId，未在线实测验证实际填充粒度）
  - roleForce/roleLevel/vipLevel 求和/平均为参考性指标，未做角色级去重
coverage_status: draft
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: 'scout 实测 ds=20260729: cnt=0, role_uv=0, acc_uv=0, server_uv=0；ds=20260728: cnt=0, role_uv=0, acc_uv=0, server_uv=0。日志中零命中，疑似事件下线或从未触发，保持 draft。'
