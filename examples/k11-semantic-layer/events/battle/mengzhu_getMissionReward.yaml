name: game.mengzhu.getMissionReward
event_filter: event = 'game.mengzhu.getMissionReward'
description: '盟主活动任务奖励领取事件：记录角色在盟主活动中领取任务奖励的行为。参数包含任务id(id)、角色及账号基础信息(角色id/账号id/角色名/性别/等级/vip/战力/经验)、货币快照(coinList: 充值钻石/赠送钻石/免费钻石/紫金/经验卷轴/体力)、会话与日志id。分析主体为 role_id(角色粒度)。scout 实测 ds=20260729 零命中。'
domains:
- 战斗关卡
domain: battle
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  id:
    type: int
    description: 任务id
metrics:
  mengzhu_get_mission_reward_cnt:
    expression: COUNT(*)
    description: 盟主活动任务奖励领取次数(总领取条数)
  mengzhu_get_mission_reward_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 领取奖励的去重角色数(分析主体为 role_id)
  mengzhu_get_mission_reward_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 领取奖励的去重账号数
  mengzhu_get_mission_reward_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 覆盖的游戏服数
  mengzhu_get_mission_reward_task_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.id'))
    description: 领取的去重任务种类数(任务id来自 params.id)
coverage:
  scenarios:
  - 盟主活动任务奖励领取频次与参与规模(次数/角色UV/账号UV/服务器数)
  - 领取的任务种类分布(按 params.id 去重)
  limitations:
  - 日志中零命中(ds=20260729/20260728 cnt=0)，疑似事件下线或当前周期未触发，metrics 仅为定义未实测
  - 仅 ds=20260729 单日 scout 实测(并回退 ds=20260728)，未做全量复核
  - 分析主体默认 role_id(角色粒度)，未实测验证
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: '2026-07-30'
  note: 'scout 实测 ds=20260729: cnt=0/role_uv=0/acc_uv=0/server_uv=0；回退 ds=20260728 仍为 0。日志中零命中，疑似事件下线或未触发，保持 draft。'
