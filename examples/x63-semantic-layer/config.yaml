project:
  name: game_10000334
  description: Game 10000334 (X63) 事件分析配置（events-only，司测阶段）
  scope_id: '10000334'
maxcompute:
  config_file: /Users/mckenzie/Documents/game-data-analysis/odps-cli/config/odps.json
  environment: overseas-prod
event_view:
  workspace: hdyl_data_sg
  view_name: ods_10000334_all_view
  full_name: hdyl_data_sg.ods_10000334_all_view
  base_columns:
    identity:
    - name: account_id
      type: string
      description: 游戏账号ID
    - name: role_id
      type: string
      description: 角色ID（分析主体，格式 区服id_entityId）
    - name: role_name
      type: string
      description: 角色名
    server:
    - name: server_id
      type: string
      description: 区服ID
    - name: server_name
      type: string
      description: 区服名
    time:
    - name: ds
      type: string
      description: 业务日期 (yyyyMMdd)
    - name: hh
      type: string
      description: 小时 (00-23)
    - name: tm
      type: datetime
      description: 行为时间
    - name: ts
      type: bigint
      description: 行为时间戳（毫秒）
    device:
    - name: os_id
      type: bigint
      description: 平台 2=安卓/3=iOS/5=Windows
    - name: dev_brand
      type: string
      description: 设备品牌
    - name: dev_model
      type: string
      description: 设备型号
    app:
    - name: app_ver
      type: string
      description: 客户端版本
    - name: ch_type
      type: string
      description: 渠道
    - name: ch_id
      type: string
      description: 渠道ID
    event_meta:
    - name: event
      type: string
      description: 事件名称
    - name: domain
      type: string
      description: 数据域（技术分类）
    - name: params
      type: string
      description: 事件参数JSON
  common_params:
  - name: serverId
    type: string
    description: 区服id
  - name: roleId
    type: string
    description: 全局id，一般是区服id+"_"+entityId
  - name: entityId
    type: int
    description: 角色id
  - name: roleName
    type: string
    description: 角色名称
  - name: roleSilverCoin
    type: int
    description: 背包中银币总量
  - name: roleGoldCoin
    type: int
    description: 背包中金币总量
  - name: totalDuration
    type: int
    description: 当日累计在线时长，下线时间不纳入计算，单位：秒
  - name: numLikes
    type: int
    description: 获赞次数
  - name: numFollowers
    type: int
    description: 关注人数
  - name: numFans
    type: int
    description: 粉丝人数
  - name: seasonId
    type: string
    description: 赛季id
  - name: rankTier
    type: string
    description: 赛季段位
  - name: rankTierLevel
    type: int
    description: 赛季段位星星数
  - name: actionCount
    type: int
    description: 赛季内总行动次数
  - name: extractCount
    type: int
    description: 赛季内总撤离次数
  - name: actionTotalDuration
    type: int
    description: 单位：秒
  - name: extractTotalValue
    type: int
    description: 赛季内累计带出价值
  - name: extractTotalItemNum
    type: int
    description: 赛季内累计带出物品数
  - name: extractTotalItemNum
    type: int
    description: 赛季内累计带出物品数
  - name: levelId
    type: int
    description: 场景id
  - name: levelUid
    type: int
    description: 场景唯一id（用于记录副本），如不是副本则填0
  - name: mappos
    type: table
    description: x：x坐标,y：y坐标,z：z坐标
  params_extract_template: GET_JSON_OBJECT(params, '$.{field_name}')
  freshness:
    today_complete: false
    latest_complete_partition: T-1
    eta_minutes: 10
    today_until_phrase_required: true
partition:
  field: ds
  format: yyyyMMdd
guards:
  max_scan_bytes: 536870912000
  max_query_timeout_seconds: 300
  max_time_range_days: 90
  select_only: true
runtime:
  model: Peach-07-17-DogFooding
