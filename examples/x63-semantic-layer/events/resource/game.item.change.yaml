name: game.item.change
event_filter: event = 'game.item.change'
description: '携带物品变更：携带物品发生变更时记录（局外+局内）

  参数：行为类型、变更详情、关联的子背包id、关联的子背包uid、变更原因1、变更原因2、变更原因3'
domains:
- 装备道具
params_fields:
  action:
    type: int
    description: '1-获得；2-失去；3-放入子背包；4-取出子背包

      如果切换位置，则3和4各记录一条'
  changeDetail:
    type: array
    description: '格式如：

      [

      {

      equipItemSlot：装备槽位id（如果放腰包中，则是物品Uid）

      equipItemSubSlot：子背包槽位id，

      equipItemId：装备物品id，

      equipItemUid：装备物品唯一id，

      equipItemDur：装备物品耐久，

      },

      ……

      ]'
  itemBagId:
    type: int
    description: 关联的子背包id，在action3/4时填关联背包物品id，1/2时填0
  itemBagUId:
    type: int
    description: 关联的子背包uid，在action3/4时填关联背包物品uid，1/2时填0
  reason1:
    type: string
    description: 待补充枚举
  reason2:
    type: string
    description: 变更原因2
  reason3:
    type: string
    description: 变更原因3
