name: game.round.act
event_filter: event = 'game.round.act'
description: |-
  角色行动行为：角色在行动中有相应行为时记录
  参数：行为类型、装备的员工id、携带的物品id
  （含腰包和扩展背包中的物品）、携带的道具价值、背包价值、角色状态、生存时长、击败怪物个数、移动距离、个人柜的物品列表、公共柜的物品列表、个人评分 等15个
domains:
  - 战斗关卡
params_fields:
  action:
    type: int
    description: 1-对局开始；2-行动开始；3-成功撤离；4-失败退出；21-掉线；22-重连；31-放入公共柜；32-从公共柜挪到个人柜；41-拔龙珠；
  equipedParagonId:
    type: int
    description: 装备的员工id
  equipItemList:
    type: array
    description: |-
      格式如：
      [
      {
      equipItemSlot：装备槽位id（如果放腰包中，则是物品Uid）
      equipItemSubSlot：子背包槽位id，
      equipItemId：装备物品id，
      equipItemUid：装备物品唯一id，
      equipItemDur：装备物品耐久，
      },
      ……
      ]
  equipValue:
    type: int
    description: 携带的道具总价值（局外购买价格，方便统计带入成本）
  lootValue:
    type: int
    description: 背包内的回收物总价值
  roleStatus:
    type: string
    description: 存活、死亡可复活、死亡不可复活
  survivalTime:
    type: int
    description: 在局内的生存时长，单位：秒
  killMonsterNum:
    type: int
    description: 在局内击败怪物数量
  moveDistance:
    type: int
    description: 在局内的移动距离，单位：米
  personalCabinetItemList:
    type: table
    description: 个人收纳柜中的物品列表
  publicCabinetItemList:
    type: table
    description: 公共收纳柜中的物品列表
  personalRating:
    type: string
    description: 个人退出时的评分，SS/A/B等（含成功撤离和失败退出）
  extractItemList:
    type: table
    description: 个人退出时带出的物品列表
  extractItemValue:
    type: int
    description: 个人退出时带出的物品总价值
  quitReason:
    type: string
    description: |-
      action为4时有效，表示玩家失败退出的原因
      取settlement_death_reason中的死亡原因
daily_count: 193.6
