description: 'PVE战斗结束：怪物死亡时，且角色有对怪物造成过伤害/对友方造成过治疗（有主动仇恨）

  说明：需要维护一个白名单列表，只针对列表中的怪物进行打点

  参数：怪物id、战斗id、战斗结果、使用的员工id、携带的物品id

  （含腰包和扩展背包中的物品）、角色状态、参与名单、战斗详情'
