name: game.role.offline
event_filter: event = 'game.role.offline'
description: '角色登出：角色登出时记录

  参数：在线时间、登出方式、离线时使用的员工id、离线时携带的物品id

  （含腰包和扩展背包中的物品）、离线时的仓库物品列表、离线时的员工信息列表（已解锁的）'
domains:
- 用户生命周期
params_fields:
  onlineDuration:
    type: int
    description: 单位：秒
  reason:
    type: string
    description: 待补充枚举
  equipedParagonId:
    type: int
    description: 离线时使用的员工id
  equipItemList:
    type: array
    description: '格式如：

      [

      {

      equipItemSlot：装备槽位id（如果放腰包中，则是物品Uid）

      equipItemSubSlot：子背包槽位id，

      equipItemId：装备物品id，

      equipItemUid：装备物品唯一id，

      equipItemDur：装备物品耐久，

      },

      ……

      ]'
  carryItemList:
    type: array
    description: '格式如：

      [

      {

      itemId：物品id，

      itemUid：物品唯一id，

      itemDur：物品耐久，

      itemBagUid：在腰包/背包里面时，记录腰包/背包Uid

      },

      ……

      ]'
  paragonInfo:
    type: array
    description: 员工id1，员工id2，员工id3，……
