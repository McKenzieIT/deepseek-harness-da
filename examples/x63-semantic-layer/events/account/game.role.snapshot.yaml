name: game.role.snapshot
event_filter: event = 'game.role.snapshot'
description: '角色快照：每日23:50刷一批当前在线角色信息

  参数：在线时间、装备的员工id、携带的物品id

  （含腰包和扩展背包中的物品）、仓库物品列表、员工信息列表（已解锁的）'
domains:
- 用户生命周期
params_fields:
  onlineDuration:
    type: int
    description: 单位：秒
  equipedParagonId:
    type: int
    description: 装备的员工id
  equipItemList:
    type: array
    description: '格式如：

      [

      {

      equipItemSlot：装备槽位id（如果放腰包中，则是物品Uid）

      equipItemSubSlot：子背包槽位id，

      equipItemId：装备物品id，

      equipItemUid：装备物品唯一id，

      equipItemDur：装备物品耐久，

      },

      ……

      ]'
  carryItemList:
    type: array
    description: '格式如：

      [

      {

      itemId：物品id，

      itemUid：物品唯一id，

      itemDur：物品耐久，

      itemBagUid：在腰包/背包里面时，记录腰包/背包Uid

      },

      ……

      ]'
  paragonInfo:
    type: array
    description: '格式如：

      2, 3, 5, 10'
daily_count: 2.0
total_count: 2
active_days: 1
tech_domain: role_private
confirmation:
  status: draft
  confirmed_by: onboarding-10000334-event-bootstrap
  confirmed_at: '2026-07-27'
coverage:
  scenarios:
  - 角色快照 事件次数与独立角色数趋势（按 ds/hh）
  limitations:
  - 事件定义来自 10000334司测埋点.xlsx（参数枚举标注『待补充』的以实际日志为准）；daily_count/total_count 来自 MaxCompute ds=20260628..20260726 司测前联调日志（约 6
    个活跃日），量级不代表司测/上线后水平；正式司测窗口为 20260727-20260728，司测结束后应重跑分布刷新量级
  - 主体粒度默认按 role_id 统计 UV，未逐事件 maxc 实测复核
  coverage_status: draft
