domains:
- name: 用户生命周期
  description: 创角、上线/登出、快照、同时在线相关
  directory: account
- name: 付费经济
  description: 商店购买/出售、商品价格相关
  directory: payment
- name: 资源产销
  description: 货币变更、仓库物品变更、reward奖励生成相关
  directory: resource
- name: 战斗关卡
  description: 匹配、行动对局、PVE战斗、死亡/复活相关
  directory: battle
- name: 探索收集
  description: 抽卡/收集系统相关（司测阶段暂无事件）
  directory: resource
- name: 角色成长
  description: 任务行为、赛季段位相关
  directory: system
- name: 社交公会
  description: 公会/好友互动相关（司测阶段暂无事件）
  directory: social
- name: 装备道具
  description: 携带物品变更、耐久、修理、死亡掉落相关
  directory: resource
- name: 系统监控
  description: SDK/客户端监控类埋点（未纳入语义层）
  directory: system
- name: 自定义
  description: 无法归入上述类别的事件
  directory: activity
